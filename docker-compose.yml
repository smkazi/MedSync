# The whole platform, for a laptop or a demo.
#
# `docker compose up --build` gives a working hospital system: Postgres, Kafka in KRaft mode, the
# five services, the AI service and the web UI. Kafka is enabled here (unlike the local dev
# scripts), so the audit consumer and the event topics are exercised as they would be in
# production.
#
# The secrets below are development values and are deliberately obvious about it. See the README's
# pre-deployment checklist before this goes anywhere real.

name: medsync

x-service-defaults: &service-defaults
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
  environment: &platform-env
    HMS_DB_URL: jdbc:postgresql://postgres:5432/hms
    # The runtime credential. Point it at hms_app once scripts/db-roles.sql has been run -- see
    # the Security section of the README. The default is the single role this ships with, so an
    # unconfigured stack comes up exactly as it did before the split existed.
    HMS_DB_USER: ${HMS_DB_USER:-hms}
    # Required, no default. See .env.example.
    HMS_DB_PASSWORD: "${HMS_DB_PASSWORD:?set HMS_DB_PASSWORD in .env, see .env.example}"
    # Flyway's credential, which owns the schemas and holds DDL. Defaults to the runtime one.
    HMS_DB_MIGRATION_USER: ${HMS_DB_MIGRATION_USER:-${HMS_DB_USER:-hms}}
    HMS_DB_MIGRATION_PASSWORD: "${HMS_DB_MIGRATION_PASSWORD:-${HMS_DB_PASSWORD}}"
    HMS_KAFKA: kafka:9092
    HMS_EVENTS_TRANSPORT: ${HMS_EVENTS_TRANSPORT:-kafka}
    HMS_JWKS_URI: http://identity-service:8081/.well-known/jwks.json
    HMS_JWT_ISSUER: http://identity-service:8081
    HMS_JWT_AUDIENCE: hms
    # The AES-256 key for encrypted patient identifiers. Required, and deliberately not
    # defaulted: this file used to carry a literal "development only" key, which gitleaks
    # flagged and was right to. A committed key is one every clone shares, and the comment
    # beside it does not stop it reaching a box that holds real records. Better to refuse
    # to start.
    HMS_PHI_KEY: "${HMS_PHI_KEY:?set HMS_PHI_KEY in .env, see .env.example}"
    HMS_TIMEZONE: ${HMS_TIMEZONE:-UTC}
    SPRING_PROFILES_ACTIVE: docker

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hms
      POSTGRES_USER: hms
      POSTGRES_PASSWORD: "${HMS_DB_PASSWORD:?set HMS_DB_PASSWORD in .env, see .env.example}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Read-only, and not in /docker-entrypoint-initdb.d on purpose: the role split is a decision
      # somebody makes, with passwords they choose, not something a first boot does silently. The
      # README's Security section gives the one command that runs it.
      - ./scripts/db-roles.sql:/opt/db-roles.sql:ro
    # Not published by default: nothing outside the compose network needs the database.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms -d hms"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: medsync-dev-cluster-0001
    expose:
      - "9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  identity-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        SERVICE: identity-service
    environment:
      <<: *platform-env
      # This service's own database credential, and the whole point of the nine roles: an
      # injected statement here is refused on another service's schema by PostgreSQL rather
      # than by this service remembering not to ask. Falls back to the shared HMS_DB_USER, so
      # a stack that has not split its credentials still starts -- with the DDL split and
      # without the isolation, which the README states in those words.
      HMS_DB_USER: ${HMS_DB_IDENTITY_USER:-${HMS_DB_USER:-hms}}
      HMS_DB_PASSWORD: "${HMS_DB_IDENTITY_PASSWORD:-${HMS_DB_PASSWORD}}"
      SERVER_PORT: 8081
      HMS_IDENTITY_PORT: 8081
      # Seeds the demo accounts. Turn this off in any real environment.
      HMS_SEED_ENABLED: "true"
      HMS_SEED_PASSWORD: ${HMS_SEED_PASSWORD:-ChangeMe!Dev2026}
    expose:
      - "8081"

  patient-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        SERVICE: patient-service
    environment:
      <<: *platform-env
      HMS_DB_USER: ${HMS_DB_PATIENT_USER:-${HMS_DB_USER:-hms}}
      HMS_DB_PASSWORD: "${HMS_DB_PATIENT_PASSWORD:-${HMS_DB_PASSWORD}}"
      SERVER_PORT: 8082
      HMS_PATIENT_PORT: 8082
      # Portal enrolment creates the account in identity-service, forwarding the receptionist's
      # own token. An address, not a credential.
      HMS_IDENTITY_URI: http://identity-service:8081
    expose:
      - "8082"

  scheduling-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        SERVICE: scheduling-service
    environment:
      <<: *platform-env
      HMS_DB_USER: ${HMS_DB_SCHEDULING_USER:-${HMS_DB_USER:-hms}}
      HMS_DB_PASSWORD: "${HMS_DB_SCHEDULING_PASSWORD:-${HMS_DB_PASSWORD}}"
      SERVER_PORT: 8083
      HMS_SCHEDULING_PORT: 8083
      HMS_AI_URI: http://ai-service:8000
      # Applying an order set raises the tests and the medicines it names in these two, with the
      # clinician's own token. A saga with compensation rather than a transaction: no database
      # transaction spans two services, so the prescription goes first and is withdrawn if the
      # laboratory order cannot be raised.
      HMS_LABORATORY_URI: http://laboratory-service:8084
      HMS_PHARMACY_URI: http://pharmacy-service:8087
      # The facility directory for room validation, and /portal/me for a self-booking patient's
      # own MRN. Both forward the caller's token.
      HMS_PATIENT_URI: http://patient-service:8082
    expose:
      - "8083"

  laboratory-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        SERVICE: laboratory-service
    environment:
      <<: *platform-env
      HMS_DB_USER: ${HMS_DB_LABORATORY_USER:-${HMS_DB_USER:-hms}}
      HMS_DB_PASSWORD: "${HMS_DB_LABORATORY_PASSWORD:-${HMS_DB_PASSWORD}}"
      SERVER_PORT: 8084
      HMS_LABORATORY_PORT: 8084
      # The register, for the name a report is printed under -- and, for a portal report, the
      # patient's own record read through /portal/me with their own token.
      HMS_PATIENT_URI: http://patient-service:8082
    expose:
      - "8084"

  notification-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        SERVICE: notification-service
    environment:
      <<: *platform-env
      HMS_DB_USER: ${HMS_DB_NOTIFICATION_USER:-${HMS_DB_USER:-hms}}
      HMS_DB_PASSWORD: "${HMS_DB_NOTIFICATION_PASSWORD:-${HMS_DB_PASSWORD}}"
      SERVER_PORT: 8085
      HMS_NOTIFICATION_PORT: 8085
      HMS_PATIENT_URI: http://patient-service:8082
      HMS_IDENTITY_URI: http://identity-service:8081
      HMS_PORTAL_URL: ${HMS_PORTAL_URL:-http://localhost:3000}
      # Unset by default, and that is a working configuration: with no service account the module
      # composes and records every message and sends none, saying so in the delivery log. Set both
      # to enable contact lookup - the account is svc.notification, seeded with the demo password.
      HMS_NOTIFICATION_ACCOUNT: ${HMS_NOTIFICATION_ACCOUNT:-}
      HMS_NOTIFICATION_PASSWORD: ${HMS_NOTIFICATION_PASSWORD:-}
      # Likewise: no mail host and no SMS URL means those channels do not exist and the platform
      # falls back to the delivery log rather than refusing to start.
      SPRING_MAIL_HOST: ${HMS_SMTP_HOST:-}
      HMS_SMS_URL: ${HMS_SMS_URL:-}
      HMS_SMS_AUTH_VALUE: ${HMS_SMS_AUTH_VALUE:-}
    expose:
      - "8085"

  admissions-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        SERVICE: admissions-service
    environment:
      <<: *platform-env
      HMS_DB_USER: ${HMS_DB_ADMISSIONS_USER:-${HMS_DB_USER:-hms}}
      HMS_DB_PASSWORD: "${HMS_DB_ADMISSIONS_PASSWORD:-${HMS_DB_PASSWORD}}"
      SERVER_PORT: 8086
      HMS_ADMISSIONS_PORT: 8086
      # The facility directory. The client fails closed, so an unreachable patient-service
      # refuses an admission rather than allocating a bed nobody has confirmed exists.
      HMS_PATIENT_URI: http://patient-service:8082
    expose:
      - "8086"

  pharmacy-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        SERVICE: pharmacy-service
    environment:
      <<: *platform-env
      HMS_DB_USER: ${HMS_DB_PHARMACY_USER:-${HMS_DB_USER:-hms}}
      HMS_DB_PASSWORD: "${HMS_DB_PHARMACY_PASSWORD:-${HMS_DB_PASSWORD}}"
      SERVER_PORT: 8087
      HMS_PHARMACY_PORT: 8087
      # The allergy list, read through the narrow endpoint. Fails closed: an unreachable
      # patient-service refuses the prescription rather than writing one that was never checked.
      HMS_PATIENT_URI: http://patient-service:8082
      # The severity at or above which an interaction must be justified in writing.
      HMS_INTERACTION_FLOOR: ${HMS_INTERACTION_FLOOR:-MAJOR}
    expose:
      - "8087"

  billing-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        SERVICE: billing-service
    environment:
      <<: *platform-env
      HMS_DB_USER: ${HMS_DB_BILLING_USER:-${HMS_DB_USER:-hms}}
      HMS_DB_PASSWORD: "${HMS_DB_BILLING_PASSWORD:-${HMS_DB_PASSWORD}}"
      SERVER_PORT: 8088
      HMS_BILLING_PORT: 8088
      # The zone a day is cashed up in, and the prefix its invoice numbers carry. Both are a
      # deployment's own, which is why neither is hard-coded in the service.
      HMS_BILLING_ZONE: ${HMS_BILLING_ZONE:-Asia/Kolkata}
      HMS_INVOICE_PREFIX: ${HMS_INVOICE_PREFIX:-INV}
    expose:
      - "8088"

  interop-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        SERVICE: interop-service
    environment:
      <<: *platform-env
      HMS_DB_USER: ${HMS_DB_INTEROP_USER:-${HMS_DB_USER:-hms}}
      HMS_DB_PASSWORD: "${HMS_DB_INTEROP_PASSWORD:-${HMS_DB_PASSWORD}}"
      SERVER_PORT: 8089
      HMS_INTEROP_PORT: 8089
      # The four services a FHIR bundle is composed from. Every call forwards the caller's own
      # token, so these are addresses rather than credentials.
      HMS_PATIENT_URI: http://patient-service:8082
      HMS_SCHEDULING_URI: http://scheduling-service:8083
      HMS_LABORATORY_URI: http://laboratory-service:8084
      HMS_PHARMACY_URI: http://pharmacy-service:8087
      # What this deployment calls itself in a bundle, and where a bundle goes. LOG records what
      # would have been sent and sends nothing, which is the honest default with no NHA
      # credentials -- see the README.
      HMS_FACILITY_NAME: ${HMS_FACILITY_NAME:-An unnamed clinical establishment}
      HMS_FACILITY_ID: ${HMS_FACILITY_ID:-UNSET}
      HMS_ABDM_GATEWAY: ${HMS_ABDM_GATEWAY:-LOG}
      HMS_ABDM_GATEWAY_URL: ${HMS_ABDM_GATEWAY_URL:-}
      HMS_ABDM_GATEWAY_AUTH_HEADER: ${HMS_ABDM_GATEWAY_AUTH_HEADER:-Authorization}
      HMS_ABDM_GATEWAY_AUTH_VALUE: ${HMS_ABDM_GATEWAY_AUTH_VALUE:-}
    expose:
      - "8089"

  ai-service:
    build:
      context: ./services/ai-service
    environment:
      HMS_AI_JWKS_URI: http://identity-service:8081/.well-known/jwks.json
      HMS_AI_JWT_ISSUER: http://identity-service:8081
      HMS_AI_JWT_AUDIENCE: hms
      # Optional. Without it, note summarisation uses its deterministic fallback.
      HMS_AI_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    expose:
      - "8000"
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        SERVICE: gateway
    environment:
      SERVER_PORT: 8080
      HMS_GATEWAY_PORT: 8080
      HMS_IDENTITY_URI: http://identity-service:8081
      HMS_PATIENT_URI: http://patient-service:8082
      HMS_SCHEDULING_URI: http://scheduling-service:8083
      HMS_LABORATORY_URI: http://laboratory-service:8084
      HMS_NOTIFICATION_URI: http://notification-service:8085
      HMS_ADMISSIONS_URI: http://admissions-service:8086
      HMS_PHARMACY_URI: http://pharmacy-service:8087
      HMS_BILLING_URI: http://billing-service:8088
      HMS_INTEROP_URI: http://interop-service:8089
      HMS_AI_URI: http://ai-service:8000
      HMS_CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      identity-service:
        condition: service_started
      patient-service:
        condition: service_started
      scheduling-service:
        condition: service_started
      laboratory-service:
        condition: service_started
      notification-service:
        condition: service_started
      admissions-service:
        condition: service_started
      pharmacy-service:
        condition: service_started
      billing-service:
        condition: service_started
      interop-service:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./web
    environment:
      GATEWAY_URL: http://gateway:8080
      IDENTITY_URL: http://identity-service:8081
      # Set to true wherever this is served over TLS, so the session cookie is marked Secure.
      COOKIE_SECURE: "false"
    ports:
      - "3000:3000"
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
