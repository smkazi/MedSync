# OWASP ZAP Automation Framework - authenticated full scan.
#
# Logs in as the seeded doctor, keeps the bearer token in a session-management header, seeds the
# real API surface with a requestor job (an API is barely spiderable), then runs a full active
# scan over it.
#
# /auth/** is excluded from the active scan on purpose: identity locks an account after five
# failed logins, so letting the injection rules hammer the login body would lock the scan user
# and every request after that would be a false 401. Login itself is attacked by the
# unauthenticated baseline and by the REST Assured abuse-case suite (tests/api), which asserts
# the lockout instead of tripping over it.
---
env:
  contexts:
    - name: medsync-api
      urls:
        - "${ZAP_TARGET}"
      includePaths:
        - "${ZAP_TARGET}/.*"
      excludePaths:
        - "${ZAP_TARGET}/auth/.*"
        - "${ZAP_TARGET}/admin/users/.*/password"
      authentication:
        method: json
        parameters:
          loginPageUrl: "${ZAP_TARGET}/auth/login"
          loginRequestUrl: "${ZAP_TARGET}/auth/login"
          loginRequestBody: '{"username":"{%username%}","password":"{%password%}"}'
        verification:
          method: response
          loggedInRegex: '"accessToken"'
          loggedOutRegex: '"status"\s*:\s*401'
          pollFrequency: 60
          pollUnits: requests
          pollUrl: "${ZAP_TARGET}/auth/me"
      sessionManagement:
        method: headers
        parameters:
          Authorization: "Bearer {%json:accessToken%}"
      users:
        - name: doctor
          credentials:
            username: "${ZAP_USERNAME}"
            password: "${ZAP_PASSWORD}"
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

jobs:
  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 10
      scanOnlyInScope: true

  - type: requestor
    name: "seed the authenticated surface"
    parameters:
      user: doctor
    requests:
      - url: "${ZAP_TARGET}/auth/me"
        method: GET
        responseCode: 200
      - url: "${ZAP_TARGET}/patients?page=0&size=20"
        method: GET
      - url: "${ZAP_TARGET}/patients?q=test&page=0&size=20"
        method: GET
      - url: "${ZAP_TARGET}/staff?q=rao&department=CARD"
        method: GET
      - url: "${ZAP_TARGET}/departments"
        method: GET
      # from/to are ISO dates here, not instants - the controller binds LocalDate.
      - url: "${ZAP_TARGET}/appointments?from=2026-01-01&to=2026-12-31&page=0&size=50"
        method: GET
      - url: "${ZAP_TARGET}/appointments?mrn=MRN-000001"
        method: GET
      - url: "${ZAP_TARGET}/appointments/availability?clinicianId=00000000-0000-0000-0000-000000000000&date=2026-06-01"
        method: GET
      - url: "${ZAP_TARGET}/lab/orders?status=ORDERED&mrn=MRN-000001&page=0&size=20"
        method: GET
      - url: "${ZAP_TARGET}/lab/catalog"
        method: GET
      - url: "${ZAP_TARGET}/lab/reference-ranges"
        method: GET
      # Raw analyzer frames are lab-only; a DOCTOR must be refused.
      - url: "${ZAP_TARGET}/lab/device-messages?page=0&size=20"
        method: GET
        responseCode: 403
      - url: "${ZAP_TARGET}/lab/analyzers"
        method: GET
      # Admin surface as a DOCTOR: these must be 403, not 200. A 200 here is a finding.
      - url: "${ZAP_TARGET}/admin/users"
        method: GET
        responseCode: 403
      - url: "${ZAP_TARGET}/admin/audit"
        method: GET
        responseCode: 403
      - url: "${ZAP_TARGET}/admin/audit.csv"
        method: GET
        responseCode: 403
      # The care-team narrowing, aimed with a real doctor's session. This encounter id belongs to
      # nobody, so a 403 is the only right answer for a clinician who is on no care team -- and a
      # 200 or a 404 here would each mean something different had gone wrong.
      - url: "${ZAP_TARGET}/encounters/00000000-0000-4000-8000-000000000000"
        method: GET
        responseCode: 403
      - url: "${ZAP_TARGET}/encounters/00000000-0000-4000-8000-000000000000/care-team"
        method: GET
        responseCode: 403
      # The initial-password gate. A doctor who has changed their password gets a token with roles
      # and reads this; an account still on its issued password gets one with none and cannot.
      # Recorded here so the active scan exercises the write surface behind it.
      - url: "${ZAP_TARGET}/patients/00000000-0000-4000-8000-000000000000"
        method: GET
        responseCode: 404
      # Facility and department master data: readable by a clinician, writable by nobody but an
      # administrator. A 200 on either of these writes is a finding.
      - url: "${ZAP_TARGET}/departments/CARD"
        method: PATCH
        data: '{"active":false}'
        responseCode: 403
      - url: "${ZAP_TARGET}/beds/00000000-0000-0000-0000-000000000000"
        method: PATCH
        data: '{"active":false}'
        responseCode: 403
      # Laboratory configuration: the three tiers of threshold that decide what a signed report
      # says. Readable by a clinician, retunable only by a pathologist or an administrator, so a
      # 200 on any of these as a DOCTOR is a finding. The morphology cut-off is the newest of the
      # three and the reason these rows exist: it had no write endpoint at all until now.
      - url: "${ZAP_TARGET}/lab/morphology-thresholds"
        method: GET
      - url: "${ZAP_TARGET}/lab/morphology-thresholds/MCV_MICROCYTIC"
        method: PATCH
        data: '{"threshold":1}'
        responseCode: 403
      - url: "${ZAP_TARGET}/lab/reference-ranges/00000000-0000-0000-0000-000000000000"
        method: PATCH
        data: '{"normalLow":0,"normalHigh":1}'
        responseCode: 403
      - url: "${ZAP_TARGET}/lab/interpretive-rules/ANISOCYTOSIS"
        method: PATCH
        data: '{"active":false}'
        responseCode: 403
      # Outbound messaging. A clinician originates a message and reads the delivery log; the
      # wording templates are the platform's voice to a patient and are administrative, so a 200
      # on that PATCH as a DOCTOR is a finding.
      - url: "${ZAP_TARGET}/notifications?size=20"
        method: GET
      - url: "${ZAP_TARGET}/notifications/capabilities"
        method: GET
      - url: "${ZAP_TARGET}/notifications/templates"
        method: GET
      - url: "${ZAP_TARGET}/notifications/templates/00000000-0000-0000-0000-000000000000"
        method: PATCH
        data: '{"body":"x {portalUrl}"}'
        responseCode: 403
      # The narrow contact endpoint exists so a service need not hold CLINICAL_READ. A doctor
      # already has the chart, so this is deliberately closed to them too - and a 200 here would
      # mean the narrowing had been quietly undone.
      - url: "${ZAP_TARGET}/patients/00000000-0000-4000-8000-000000000000/contact"
        method: GET
        responseCode: 403
      # The OPD token board: readable by everybody clinical, and it carries a room code, some
      # numbers and an appointment id - less than the appointment book they can already read.
      - url: "${ZAP_TARGET}/queue/GF-GEN"
        method: GET
      # Casualty and the in-patient census. A doctor holds BED_MANAGE, so these are 200 and are
      # here to put the surface in front of the active scan: the board carries a presenting
      # complaint and an acuity, which is the most sensitive free text the platform serves in a
      # list, and the injection rules should be aimed at it. Who is refused is asserted in
      # tests/api instead - ZAP logs in as one user and cannot express "403 as reception".
      - url: "${ZAP_TARGET}/casualty"
        method: GET
      - url: "${ZAP_TARGET}/casualty?status=WAITING"
        method: GET
      - url: "${ZAP_TARGET}/casualty/beds"
        method: GET
      - url: "${ZAP_TARGET}/admissions"
        method: GET
      - url: "${ZAP_TARGET}/admissions/beds"
        method: GET
      # A triage re-grade and a bed placement against ids that do not exist: 404, and the point is
      # that the refusal comes from the lookup rather than from the body. A 200 or a 500 here
      # would mean an unvalidated path parameter reached the allocator.
      - url: "${ZAP_TARGET}/casualty/00000000-0000-4000-8000-000000000000/triage"
        method: PATCH
        data: '{"triageAcuity":1}'
        responseCode: 404
      - url: "${ZAP_TARGET}/admissions/00000000-0000-4000-8000-000000000000"
        method: GET
        responseCode: 404
      # The medication loop. A doctor prescribes, so the read surface is 200 and the write is
      # aimed at by the active scan; dispensing and the formulary are the pharmacy's, so a 200
      # there as a DOCTOR is a finding. Who else is refused is asserted in tests/api - ZAP logs in
      # as one user and cannot express "403 as a pharmacist".
      - url: "${ZAP_TARGET}/pharmacy/formulary"
        method: GET
      - url: "${ZAP_TARGET}/pharmacy/interactions"
        method: GET
      - url: "${ZAP_TARGET}/pharmacy/stock"
        method: GET
      - url: "${ZAP_TARGET}/prescriptions"
        method: GET
      - url: "${ZAP_TARGET}/pharmacy/formulary"
        method: POST
        data: '{"code":"ZAP1","name":"Zap","form":"TABLET","strength":"1 mg","unit":"tablet","ingredients":["ZAPIUM"]}'
        responseCode: 403
      - url: "${ZAP_TARGET}/pharmacy/interactions"
        method: POST
        data: '{"ingredientA":"A","ingredientB":"B","severity":"MINOR","effect":"x","management":"y"}'
        responseCode: 403
      - url: "${ZAP_TARGET}/pharmacy/stock"
        method: POST
        data: '{"drugCode":"PARA500","batchNo":"ZAP","expiresOn":"2030-01-01","quantity":1}'
        responseCode: 403
      - url: "${ZAP_TARGET}/pharmacy/dispenses"
        method: POST
        data: '{"prescriptionItemId":"00000000-0000-4000-8000-000000000000","quantity":1}'
        responseCode: 403
      # The safety check itself, with a body the scan can mutate: it takes a patient id and a list
      # of drug codes and reaches patient-service for the allergy list, so it is the widest
      # injection surface the pharmacy has.
      - url: "${ZAP_TARGET}/pharmacy/check"
        method: POST
        data: '{"patientId":"00000000-0000-4000-8000-000000000000","drugCodes":["PARA500"]}'
        responseCode: 404
      # The narrow allergy endpoint. Held by the pharmacy and by clinicians, so a doctor reads it -
      # the row is here so the active scan exercises the path, not to assert a refusal.
      - url: "${ZAP_TARGET}/patients/00000000-0000-4000-8000-000000000000/allergies"
        method: GET
        responseCode: 404
      # Order sets and care plans. Reading a set is clinical reference data and writing one is
      # administrative, so the POST must be 403 as a DOCTOR - a set is applied in one click by
      # anybody who may chart, which makes composing one a governance act rather than data entry.
      - url: "${ZAP_TARGET}/order-sets"
        method: GET
      - url: "${ZAP_TARGET}/order-sets/FEVER1"
        method: GET
      - url: "${ZAP_TARGET}/order-sets"
        method: POST
        data: '{"code":"ZAPSET","name":"Zap","items":[{"kind":"LAB","code":"CBC"}]}'
        responseCode: 403
      # Applying a set fans out to two other services with the caller's own token. Aimed at an
      # encounter that does not exist, so the refusal comes from the lookup rather than from the
      # body: a 200 or a 500 here would mean an unvalidated path reached the fan-out.
      - url: "${ZAP_TARGET}/order-sets/FEVER1/apply"
        method: POST
        data: '{"encounterId":"00000000-0000-4000-8000-000000000000"}'
        responseCode: 404
      - url: "${ZAP_TARGET}/care-plans/encounters/00000000-0000-4000-8000-000000000000"
        method: GET
        responseCode: 404
      # The money. A doctor reads what a patient was billed - asked at the bedside, and a platform
      # that sent them to the billing desk for a number would be routed around - and may not raise
      # an invoice, post a charge or take a payment. Those three 403s are the oldest financial
      # control there is written as scan rows: the person who decides what was done is not the
      # person who records that it was paid.
      - url: "${ZAP_TARGET}/invoices"
        method: GET
      - url: "${ZAP_TARGET}/charge-items"
        method: GET
      - url: "${ZAP_TARGET}/payers"
        method: GET
      - url: "${ZAP_TARGET}/tax-rates"
        method: GET
      - url: "${ZAP_TARGET}/claims"
        method: GET
      - url: "${ZAP_TARGET}/day-book"
        method: GET
      - url: "${ZAP_TARGET}/invoices"
        method: POST
        data: '{"patientId":"00000000-0000-4000-8000-000000000000","patientMrn":"ZAP"}'
        responseCode: 403
      - url: "${ZAP_TARGET}/charges"
        method: POST
        data: '{"sourceType":"MANUAL","sourceId":"00000000-0000-4000-8000-000000000000","patientId":"00000000-0000-4000-8000-000000000000","patientMrn":"ZAP","chargeItemCode":"CONSULT_OP","qty":1}'
        responseCode: 403
      - url: "${ZAP_TARGET}/invoices/00000000-0000-4000-8000-000000000000/payments"
        method: POST
        data: '{"amount":1.00,"method":"CASH"}'
        responseCode: 403
      - url: "${ZAP_TARGET}/claims"
        method: POST
        data: '{"invoiceId":"00000000-0000-4000-8000-000000000000"}'
        responseCode: 403
      # Setting prices is an administrator's, not a clinician's and not a cashier's. Who else is
      # refused is asserted in tests/api - ZAP logs in as one user and cannot express "403 as a
      # cashier".
      - url: "${ZAP_TARGET}/charge-items"
        method: POST
        data: '{"code":"ZAPITEM","name":"Zap","unitPrice":1.00}'
        responseCode: 403
      - url: "${ZAP_TARGET}/tax-rates"
        method: POST
        data: '{"code":"ZAPGST","name":"Zap","percent":1.00,"effectiveFrom":"2030-01-01"}'
        responseCode: 403
      # Reading an invoice that does not exist: 404 from the lookup, not a 500 from an unvalidated
      # path parameter reaching a query.
      - url: "${ZAP_TARGET}/invoices/00000000-0000-4000-8000-000000000000"
        method: GET
        responseCode: 404
      # The narrow patient lookup a cashier holds. A doctor is not in PATIENT_IDENTIFY - they have
      # the full register - so this is 403 for the scanning user, and that is the assertion: a
      # narrow endpoint that quietly widened would show up here.
      - url: "${ZAP_TARGET}/patients/identify?q=zap"
        method: GET
        responseCode: 403
      # Consent and health-information exchange. The scanning user is a DOCTOR, so reading the
      # consent register is 200 -- a clinician about to refer needs to know whether a consent
      # covers it -- and every write here is refused: recording what the patient decided is the
      # front desk's, and exporting a whole chart is an administrator's.
      - url: "${ZAP_TARGET}/consents"
        method: GET
      - url: "${ZAP_TARGET}/interop/disclosures?patientId=00000000-0000-4000-8000-000000000000"
        method: GET
      - url: "${ZAP_TARGET}/consents"
        method: POST
        data: '{"patientId":"00000000-0000-4000-8000-000000000000","patientMrn":"ZAP","requester":"Zap","purposeCode":"CARE_MANAGEMENT","hiTypes":["OP_CONSULTATION"],"coversFrom":"2026-01-01","coversTo":"2026-12-31","expiresAt":"2030-01-01T00:00:00Z"}'
        responseCode: 403
      - url: "${ZAP_TARGET}/interop/export/00000000-0000-4000-8000-000000000000"
        method: POST
        responseCode: 403
      # The share path, aimed at a consent that does not exist: the refusal must come from the
      # consent lookup rather than from the body, and it must be a 404 rather than a 500 -- an
      # unvalidated artefact id reaching a query is what this row would catch.
      - url: "${ZAP_TARGET}/interop/share"
        method: POST
        data: '{"artefactId":"ZAP-NOT-A-CONSENT","hiType":"OP_CONSULTATION","recordId":"00000000-0000-4000-8000-000000000000"}'
        responseCode: 404
      # Writing a national health identifier. A doctor reads one a referral quotes and does not
      # write one, so this is 403 for the scanning user -- and PUT with a well-formed body means
      # only the role can be what refuses it.
      - url: "${ZAP_TARGET}/patients/00000000-0000-4000-8000-000000000000/abha"
        method: PUT
        data: '{"abhaNumber":"12345678901234","abhaAddress":"zap@sbx"}'
        responseCode: 403
      # The audited identifier release, aimed at a patient who does not exist: 404 from the
      # lookup, and the row exists so the active scan exercises the path at all.
      - url: "${ZAP_TARGET}/patients/00000000-0000-4000-8000-000000000000/identifiers"
        method: GET
        responseCode: 404
      # The wristband. A doctor may print one, so this is a 404 for a patient who does not exist
      # rather than a refusal — the row is here because this endpoint renders operator-supplied text
      # (a patient's own name) into markup that a browser then inlines, which is exactly the shape
      # the active scan's injection rules are for.
      - url: "${ZAP_TARGET}/patients/00000000-0000-4000-8000-000000000000/wristband"
        method: GET
        responseCode: 404
      # Radiology, from a clinician's side of the department.
      #
      # ZAP logs in as one user and cannot express "403 as a radiographer", so the sharpest pair --
      # a radiographer refused the report and a radiologist refused the acquisition -- is asserted
      # in tests/api, as the comments above do for reception and the pharmacy. What can be asserted
      # here is the other half of the same line, and it is not the weaker half: a doctor is the role
      # most likely to be widened by accident, because they legitimately order the examination and
      # read the report, and the two acts in between are somebody else's.
      - url: "${ZAP_TARGET}/imaging/worklist"
        method: GET
        responseCode: 403
      - url: "${ZAP_TARGET}/imaging/studies/unmatched"
        method: GET
        responseCode: 403
      - url: "${ZAP_TARGET}/imaging/reporting-queue"
        method: GET
        responseCode: 403
      # Drafting and signing, with well-formed bodies so that only the role can be what refuses
      # them: @Valid resolves during argument binding before @PreAuthorize runs, so an empty body
      # would answer 400 and the row would pass whatever the role rules said.
      - url: "${ZAP_TARGET}/imaging/studies/00000000-0000-4000-8000-000000000000/report"
        method: PUT
        data: '{"findings":"ZAP","impression":"ZAP"}'
        responseCode: 403
      - url: "${ZAP_TARGET}/imaging/studies/00000000-0000-4000-8000-000000000000/report/sign"
        method: POST
        responseCode: 403
      #
      # POST /imaging/orders has no row either, and this one was written before it was removed. The
      # intent was to give the active scan a free-text field that ends up on a signed report, and
      # the expectation was 404 for a patient who does not exist. Run against the live stack it
      # answered 201: a clinical order's patientId is another service's id and is not resolved, on
      # this service or on the laboratory -- checked, rather than assumed, and it is the platform's
      # existing posture rather than anything new here. Which makes the row actively harmful: every
      # scheduled scan would mint a real accession number and put a junk examination on the
      # department's worklist. The injection surface it was meant to cover is reached by
      # InjectionAbuseIT instead, which orders against a patient it registered first.
      #
      # POST /imaging/studies has no row, and the reason is worth stating rather than leaving as a
      # silence: it consumes multipart/form-data, which the requestor job cannot compose. Its
      # refusals are a @ParameterizedTest in tests/api sending a real multipart body -- and they
      # have to be, because a JSON request there is answered 415 before authorization is reached.
      # The patient portal, every path, refused to the scanning clinician.
      #
      # This block is different in kind from every other 403 above. Elsewhere a 403 says "this
      # clinician holds the wrong role for this act"; here it says something stronger, which is
      # that /portal answers "the signed-in patient's own record" and there is no patient a
      # clinician is. The Roles.PORTAL constant is the only one in the platform that does not
      # carry ADMIN, for exactly that reason -- so a 200 on any row here would mean the portal had
      # acquired a second audience, and the record it served would be a record chosen by whatever
      # the endpoint fell back to when the patient claim was missing.
      #
      # Aimed with a real logged-in session on purpose. Unauthenticated, /portal answers 401 and
      # proves nothing about the claim.
      - url: "${ZAP_TARGET}/portal/me"
        method: GET
        responseCode: 403
      - url: "${ZAP_TARGET}/portal/appointments"
        method: GET
        responseCode: 403
      - url: "${ZAP_TARGET}/portal/encounters"
        method: GET
        responseCode: 403
      - url: "${ZAP_TARGET}/portal/reports"
        method: GET
        responseCode: 403
      - url: "${ZAP_TARGET}/portal/prescriptions"
        method: GET
        responseCode: 403
      - url: "${ZAP_TARGET}/portal/invoices"
        method: GET
        responseCode: 403
      - url: "${ZAP_TARGET}/portal/invoices/balance"
        method: GET
        responseCode: 403
      - url: "${ZAP_TARGET}/portal/messages"
        method: GET
        responseCode: 403
      - url: "${ZAP_TARGET}/portal/records/export"
        method: GET
        responseCode: 403
      - url: "${ZAP_TARGET}/portal/records/disclosures"
        method: GET
        responseCode: 403
      # A write, with a well-formed body, so only the role can be what refuses it.
      - url: "${ZAP_TARGET}/portal/appointments"
        method: POST
        data: '{"clinicianId":"00000000-0000-4000-8000-000000000000","departmentCode":"GEN","startsAt":"2030-01-01T09:00:00Z","durationMinutes":15}'
        responseCode: 403
      - url: "${ZAP_TARGET}/portal/messages"
        method: POST
        data: '{"subject":"zap","body":"zap"}'
        responseCode: 403
      # Handing out portal credentials. The front desk's, because enrolment is an identity check
      # somebody performs face to face -- a clinician who could mint an account against any patient
      # id could mint one against a neighbour's record and read it at home, with the audit line
      # naming a routine enrolment.
      - url: "${ZAP_TARGET}/admin/portal-accounts"
        method: POST
        data: '{"patientId":"00000000-0000-4000-8000-000000000000","mrn":"MRN-ZAP","email":"zap@example.invalid","fullName":"Zap"}'
        responseCode: 403
      - url: "${ZAP_TARGET}/patients/00000000-0000-4000-8000-000000000000/portal-account"
        method: POST
        responseCode: 403
      # The hospital's side of secure messaging is a clinician's, so this one is 200: the row is
      # here to put the queue in front of the active scan rather than to assert a refusal. It is
      # the widest free-text surface the platform serves, since a patient types into it.
      - url: "${ZAP_TARGET}/notifications/messages?size=20"
        method: GET

  - type: spider
    parameters:
      context: medsync-api
      user: doctor
      maxDuration: 3
      maxDepth: 6

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: activeScan
    parameters:
      context: medsync-api
      user: doctor
      maxRuleDurationInMins: 3
      maxScanDurationInMins: 45
      policy: "medsync-api"
    policyDefinition:
      defaultStrength: medium
      defaultThreshold: medium
      rules:
        # SQL injection, at high strength - the search and filter endpoints are the whole point
        # of this scan, and they are the only places raw terms reach a query.
        - id: 40018
          strength: high
          threshold: low
        - id: 40019
          strength: high
          threshold: low
        - id: 40020
          strength: high
          threshold: low
        - id: 40021
          strength: high
          threshold: low
        - id: 40022
          strength: high
          threshold: low
        # Command injection and code injection.
        - id: 90020
          strength: high
          threshold: low
        - id: 90019
          strength: high
          threshold: low
        # XSS - the API returns JSON, but a reflected value that survives into the UI matters.
        - id: 40012
          threshold: low
        - id: 40014
          threshold: low
        - id: 40016
          threshold: low
        - id: 40017
          threshold: low
        # Path traversal / RFI against a JSON API: noise.
        - id: 6
          threshold: off
        - id: 7
          threshold: off

  - type: report
    parameters:
      template: traditional-html
      reportDir: "${ZAP_REPORT_DIR}"
      reportFile: "zap-authenticated"
      reportTitle: "MedSync - authenticated full scan"
    risks: [high, medium, low, info]

  - type: report
    parameters:
      template: sarif-json
      reportDir: "${ZAP_REPORT_DIR}"
      # Named so the file lands as zap-authenticated.sarif.json - GitHub's SARIF upload only
      # recognises .sarif and .sarif.json, and the sarif-json template appends .json.
      reportFile: "zap-authenticated.sarif"
    risks: [high, medium]

  - type: report
    parameters:
      template: traditional-json
      reportDir: "${ZAP_REPORT_DIR}"
      reportFile: "zap-authenticated"
    risks: [high, medium, low, info]
