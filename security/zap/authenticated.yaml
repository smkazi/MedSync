# OWASP ZAP Automation Framework - authenticated full scan.
#
# Logs in as the seeded doctor, keeps the bearer token in a session-management header, seeds the
# real API surface with a requestor job (an API is barely spiderable), then runs a full active
# scan over it.
#
# /auth/** is excluded from the active scan on purpose: identity locks an account after five
# failed logins, so letting the injection rules hammer the login body would lock the scan user
# and every request after that would be a false 401. Login itself is attacked by the
# unauthenticated baseline and by the REST Assured abuse-case suite (tests/api), which asserts
# the lockout instead of tripping over it.
---
env:
  contexts:
    - name: medsync-api
      urls:
        - "${ZAP_TARGET}"
      includePaths:
        - "${ZAP_TARGET}/.*"
      excludePaths:
        - "${ZAP_TARGET}/auth/.*"
        - "${ZAP_TARGET}/admin/users/.*/password"
      authentication:
        method: json
        parameters:
          loginPageUrl: "${ZAP_TARGET}/auth/login"
          loginRequestUrl: "${ZAP_TARGET}/auth/login"
          loginRequestBody: '{"username":"{%username%}","password":"{%password%}"}'
        verification:
          method: response
          loggedInRegex: '"accessToken"'
          loggedOutRegex: '"status"\s*:\s*401'
          pollFrequency: 60
          pollUnits: requests
          pollUrl: "${ZAP_TARGET}/auth/me"
      sessionManagement:
        method: headers
        parameters:
          Authorization: "Bearer {%json:accessToken%}"
      users:
        - name: doctor
          credentials:
            username: "${ZAP_USERNAME}"
            password: "${ZAP_PASSWORD}"
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

jobs:
  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 10
      scanOnlyInScope: true

  - type: requestor
    name: "seed the authenticated surface"
    parameters:
      user: doctor
    requests:
      - url: "${ZAP_TARGET}/auth/me"
        method: GET
        responseCode: 200
      - url: "${ZAP_TARGET}/patients?page=0&size=20"
        method: GET
      - url: "${ZAP_TARGET}/patients?q=test&page=0&size=20"
        method: GET
      - url: "${ZAP_TARGET}/staff?q=rao&department=CARD"
        method: GET
      - url: "${ZAP_TARGET}/departments"
        method: GET
      # from/to are ISO dates here, not instants - the controller binds LocalDate.
      - url: "${ZAP_TARGET}/appointments?from=2026-01-01&to=2026-12-31&page=0&size=50"
        method: GET
      - url: "${ZAP_TARGET}/appointments?mrn=MRN-000001"
        method: GET
      - url: "${ZAP_TARGET}/appointments/availability?clinicianId=00000000-0000-0000-0000-000000000000&date=2026-06-01"
        method: GET
      - url: "${ZAP_TARGET}/lab/orders?status=ORDERED&mrn=MRN-000001&page=0&size=20"
        method: GET
      - url: "${ZAP_TARGET}/lab/catalog"
        method: GET
      - url: "${ZAP_TARGET}/lab/reference-ranges"
        method: GET
      # Raw analyzer frames are lab-only; a DOCTOR must be refused.
      - url: "${ZAP_TARGET}/lab/device-messages?page=0&size=20"
        method: GET
        responseCode: 403
      - url: "${ZAP_TARGET}/lab/analyzers"
        method: GET
      # Admin surface as a DOCTOR: these must be 403, not 200. A 200 here is a finding.
      - url: "${ZAP_TARGET}/admin/users"
        method: GET
        responseCode: 403
      - url: "${ZAP_TARGET}/admin/audit"
        method: GET
        responseCode: 403
      # The initial-password gate. A doctor who has changed their password gets a token with roles
      # and reads this; an account still on its issued password gets one with none and cannot.
      # Recorded here so the active scan exercises the write surface behind it.
      - url: "${ZAP_TARGET}/patients/00000000-0000-4000-8000-000000000000"
        method: GET
        responseCode: 404
      # Facility and department master data: readable by a clinician, writable by nobody but an
      # administrator. A 200 on either of these writes is a finding.
      - url: "${ZAP_TARGET}/departments/CARD"
        method: PATCH
        data: '{"active":false}'
        responseCode: 403
      - url: "${ZAP_TARGET}/beds/00000000-0000-0000-0000-000000000000"
        method: PATCH
        data: '{"active":false}'
        responseCode: 403
      # Laboratory configuration: the three tiers of threshold that decide what a signed report
      # says. Readable by a clinician, retunable only by a pathologist or an administrator, so a
      # 200 on any of these as a DOCTOR is a finding. The morphology cut-off is the newest of the
      # three and the reason these rows exist: it had no write endpoint at all until now.
      - url: "${ZAP_TARGET}/lab/morphology-thresholds"
        method: GET
      - url: "${ZAP_TARGET}/lab/morphology-thresholds/MCV_MICROCYTIC"
        method: PATCH
        data: '{"threshold":1}'
        responseCode: 403
      - url: "${ZAP_TARGET}/lab/reference-ranges/00000000-0000-0000-0000-000000000000"
        method: PATCH
        data: '{"normalLow":0,"normalHigh":1}'
        responseCode: 403
      - url: "${ZAP_TARGET}/lab/interpretive-rules/ANISOCYTOSIS"
        method: PATCH
        data: '{"active":false}'
        responseCode: 403
      # Outbound messaging. A clinician originates a message and reads the delivery log; the
      # wording templates are the platform's voice to a patient and are administrative, so a 200
      # on that PATCH as a DOCTOR is a finding.
      - url: "${ZAP_TARGET}/notifications?size=20"
        method: GET
      - url: "${ZAP_TARGET}/notifications/capabilities"
        method: GET
      - url: "${ZAP_TARGET}/notifications/templates"
        method: GET
      - url: "${ZAP_TARGET}/notifications/templates/00000000-0000-0000-0000-000000000000"
        method: PATCH
        data: '{"body":"x {portalUrl}"}'
        responseCode: 403
      # The narrow contact endpoint exists so a service need not hold CLINICAL_READ. A doctor
      # already has the chart, so this is deliberately closed to them too - and a 200 here would
      # mean the narrowing had been quietly undone.
      - url: "${ZAP_TARGET}/patients/00000000-0000-4000-8000-000000000000/contact"
        method: GET
        responseCode: 403
      # The OPD token board: readable by everybody clinical, and it carries a room code, some
      # numbers and an appointment id - less than the appointment book they can already read.
      - url: "${ZAP_TARGET}/queue/GF-GEN"
        method: GET
      # Casualty and the in-patient census. A doctor holds BED_MANAGE, so these are 200 and are
      # here to put the surface in front of the active scan: the board carries a presenting
      # complaint and an acuity, which is the most sensitive free text the platform serves in a
      # list, and the injection rules should be aimed at it. Who is refused is asserted in
      # tests/api instead - ZAP logs in as one user and cannot express "403 as reception".
      - url: "${ZAP_TARGET}/casualty"
        method: GET
      - url: "${ZAP_TARGET}/casualty?status=WAITING"
        method: GET
      - url: "${ZAP_TARGET}/casualty/beds"
        method: GET
      - url: "${ZAP_TARGET}/admissions"
        method: GET
      - url: "${ZAP_TARGET}/admissions/beds"
        method: GET
      # A triage re-grade and a bed placement against ids that do not exist: 404, and the point is
      # that the refusal comes from the lookup rather than from the body. A 200 or a 500 here
      # would mean an unvalidated path parameter reached the allocator.
      - url: "${ZAP_TARGET}/casualty/00000000-0000-4000-8000-000000000000/triage"
        method: PATCH
        data: '{"triageAcuity":1}'
        responseCode: 404
      - url: "${ZAP_TARGET}/admissions/00000000-0000-4000-8000-000000000000"
        method: GET
        responseCode: 404
      # The medication loop. A doctor prescribes, so the read surface is 200 and the write is
      # aimed at by the active scan; dispensing and the formulary are the pharmacy's, so a 200
      # there as a DOCTOR is a finding. Who else is refused is asserted in tests/api - ZAP logs in
      # as one user and cannot express "403 as a pharmacist".
      - url: "${ZAP_TARGET}/pharmacy/formulary"
        method: GET
      - url: "${ZAP_TARGET}/pharmacy/interactions"
        method: GET
      - url: "${ZAP_TARGET}/pharmacy/stock"
        method: GET
      - url: "${ZAP_TARGET}/prescriptions"
        method: GET
      - url: "${ZAP_TARGET}/pharmacy/formulary"
        method: POST
        data: '{"code":"ZAP1","name":"Zap","form":"TABLET","strength":"1 mg","unit":"tablet","ingredients":["ZAPIUM"]}'
        responseCode: 403
      - url: "${ZAP_TARGET}/pharmacy/interactions"
        method: POST
        data: '{"ingredientA":"A","ingredientB":"B","severity":"MINOR","effect":"x","management":"y"}'
        responseCode: 403
      - url: "${ZAP_TARGET}/pharmacy/stock"
        method: POST
        data: '{"drugCode":"PARA500","batchNo":"ZAP","expiresOn":"2030-01-01","quantity":1}'
        responseCode: 403
      - url: "${ZAP_TARGET}/pharmacy/dispenses"
        method: POST
        data: '{"prescriptionItemId":"00000000-0000-4000-8000-000000000000","quantity":1}'
        responseCode: 403
      # The safety check itself, with a body the scan can mutate: it takes a patient id and a list
      # of drug codes and reaches patient-service for the allergy list, so it is the widest
      # injection surface the pharmacy has.
      - url: "${ZAP_TARGET}/pharmacy/check"
        method: POST
        data: '{"patientId":"00000000-0000-4000-8000-000000000000","drugCodes":["PARA500"]}'
        responseCode: 404
      # The narrow allergy endpoint. Held by the pharmacy and by clinicians, so a doctor reads it -
      # the row is here so the active scan exercises the path, not to assert a refusal.
      - url: "${ZAP_TARGET}/patients/00000000-0000-4000-8000-000000000000/allergies"
        method: GET
        responseCode: 404
      # Order sets and care plans. Reading a set is clinical reference data and writing one is
      # administrative, so the POST must be 403 as a DOCTOR - a set is applied in one click by
      # anybody who may chart, which makes composing one a governance act rather than data entry.
      - url: "${ZAP_TARGET}/order-sets"
        method: GET
      - url: "${ZAP_TARGET}/order-sets/FEVER1"
        method: GET
      - url: "${ZAP_TARGET}/order-sets"
        method: POST
        data: '{"code":"ZAPSET","name":"Zap","items":[{"kind":"LAB","code":"CBC"}]}'
        responseCode: 403
      # Applying a set fans out to two other services with the caller's own token. Aimed at an
      # encounter that does not exist, so the refusal comes from the lookup rather than from the
      # body: a 200 or a 500 here would mean an unvalidated path reached the fan-out.
      - url: "${ZAP_TARGET}/order-sets/FEVER1/apply"
        method: POST
        data: '{"encounterId":"00000000-0000-4000-8000-000000000000"}'
        responseCode: 404
      - url: "${ZAP_TARGET}/care-plans/encounters/00000000-0000-4000-8000-000000000000"
        method: GET
        responseCode: 404

  - type: spider
    parameters:
      context: medsync-api
      user: doctor
      maxDuration: 3
      maxDepth: 6

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: activeScan
    parameters:
      context: medsync-api
      user: doctor
      maxRuleDurationInMins: 3
      maxScanDurationInMins: 45
      policy: "medsync-api"
    policyDefinition:
      defaultStrength: medium
      defaultThreshold: medium
      rules:
        # SQL injection, at high strength - the search and filter endpoints are the whole point
        # of this scan, and they are the only places raw terms reach a query.
        - id: 40018
          strength: high
          threshold: low
        - id: 40019
          strength: high
          threshold: low
        - id: 40020
          strength: high
          threshold: low
        - id: 40021
          strength: high
          threshold: low
        - id: 40022
          strength: high
          threshold: low
        # Command injection and code injection.
        - id: 90020
          strength: high
          threshold: low
        - id: 90019
          strength: high
          threshold: low
        # XSS - the API returns JSON, but a reflected value that survives into the UI matters.
        - id: 40012
          threshold: low
        - id: 40014
          threshold: low
        - id: 40016
          threshold: low
        - id: 40017
          threshold: low
        # Path traversal / RFI against a JSON API: noise.
        - id: 6
          threshold: off
        - id: 7
          threshold: off

  - type: report
    parameters:
      template: traditional-html
      reportDir: "${ZAP_REPORT_DIR}"
      reportFile: "zap-authenticated"
      reportTitle: "MedSync - authenticated full scan"
    risks: [high, medium, low, info]

  - type: report
    parameters:
      template: sarif-json
      reportDir: "${ZAP_REPORT_DIR}"
      # Named so the file lands as zap-authenticated.sarif.json - GitHub's SARIF upload only
      # recognises .sarif and .sarif.json, and the sarif-json template appends .json.
      reportFile: "zap-authenticated.sarif"
    risks: [high, medium]

  - type: report
    parameters:
      template: traditional-json
      reportDir: "${ZAP_REPORT_DIR}"
      reportFile: "zap-authenticated"
    risks: [high, medium, low, info]
