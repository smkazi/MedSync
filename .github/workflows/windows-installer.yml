# Builds MedSync-Setup.exe and, on a real Windows runner, proves it does what it says.
#
# This workflow exists because of a limitation rather than a preference: the installer targets
# Windows and was written on Linux, so its Windows-specific half — the console-window detection, the
# detached process flags, taskkill /T, the Program Files search paths, initdb and pg_ctl under
# Windows, the registry PATH re-read — cannot be executed at all on the machine it was written on.
# A `windows-latest` runner can execute it, and that turns "reviewed" into "verified", which for an
# executable a stranger is about to double-click is not a small difference.
#
# Two jobs, split by how long they take:
#
#   fast   — every push. Cross-compiles, then on Windows runs version/doctor/fetch/db/status/down.
#            That covers every Windows-only code path except the build itself, in about five
#            minutes, so it can gate every commit.
#   full   — on demand and nightly. The whole thing: fourteen Maven modules, the web app, twelve
#            services, the smoke test. Twenty to forty minutes on a Windows runner, which is why it
#            is not on the push path — CI that people stop waiting for is CI that stops being read.

name: Windows installer

on:
  push:
    branches: ["**"]
    paths:
      - "installer/**"
      - ".github/workflows/windows-installer.yml"
  pull_request:
    paths:
      - "installer/**"
  workflow_dispatch:
    inputs:
      full:
        description: "Also run the full install (build + start + smoke) on Windows"
        type: boolean
        default: true
  schedule:
    # 03:30 UTC, after the nightly security workflow rather than beside it: two long jobs competing
    # for runners means both report late.
    - cron: "30 3 * * *"

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-compile:
    name: Cross-compile (linux -> windows)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          # No dependencies to cache: the installer is standard library only, deliberately, so
          # there is no module download step to go wrong or to slow this down.
          cache: false

      - name: Vet
        working-directory: installer/windows
        run: go vet ./...

      # Both platforms, because the Unix build is not a curiosity: it is how the seven
      # platform-independent files get exercised locally, and a break in it means that verification
      # path has quietly gone away.
      - name: Build for Windows and for Linux
        run: |
          bash installer/windows/build.sh
          bash installer/windows/build.sh --linux

      - name: Confirm the output really is a Windows executable
        run: |
          file dist/MedSync-Setup.exe | tee /dev/stderr | grep -q "PE32+ executable (console) x86-64"
          file dist/MedSync-Setup-arm64.exe | grep -q "PE32+ executable (console) Aarch64"

      - uses: actions/upload-artifact@v4
        with:
          name: MedSync-Setup
          path: |
            dist/MedSync-Setup.exe
            dist/MedSync-Setup-arm64.exe
          if-no-files-found: error
          retention-days: 30

  windows-fast:
    name: Windows (the paths Linux cannot run)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # One home for the whole job, and not the real %LOCALAPPDATA%: a CI job that writes where a
      # developer's install would live is a job whose cleanup step matters, and the runner's temp
      # directory is thrown away regardless of how this ends.
      #
      # Exported through GITHUB_ENV from a step rather than declared in the job's `env:` block,
      # because the `runner` context is not available there — it is a step-level context, and a
      # job-level `env` that names it fails the whole workflow at validation with no job to
      # attribute the error to. RUNNER_TEMP is the same value as a plain environment variable,
      # which every shell can read.
      # A block scalar, not a quoted one: a `run:` value that starts with a double quote is a YAML
      # string, and the pipe after it would be trailing garbage rather than PowerShell.
      - name: Choose a home for this job
        run: |
          "MEDSYNC_HOME=$env:RUNNER_TEMP\medsync" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      # Built natively here rather than downloaded from the job above, so a cross-compilation that
      # produces a binary Windows will not load fails as its own distinct error.
      - name: Build natively
        working-directory: installer/windows
        run: go build -trimpath -ldflags "-s -w" -o ..\..\dist\MedSync-Setup.exe .

      - name: version
        run: .\dist\MedSync-Setup.exe version

      - name: help
        run: .\dist\MedSync-Setup.exe help

      # The version floor is checked from the failing side first, and the JDK is pinned rather than
      # inherited. Two runs of this workflow taught both halves of that sentence: the first found
      # windows-latest defaulting to JDK 17 and doctor correctly calling it too old, and the second
      # got a runner whose Docker engine happened to be running — where a too-old JDK is genuinely
      # not fatal, because that route needs no JDK at all. So the image's defaults decide nothing
      # here: setup-java installs 17 on purpose, and the route is forced with MEDSYNC_MODE.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: doctor refuses a JDK that is too old
        run: |
          $out = .\dist\MedSync-Setup.exe doctor 2>&1 | Out-String
          $out
          # The Java row itself, which is the version floor. Asserted on the output rather than on
          # the exit code, because whether a too-old JDK is fatal depends on whether there is a
          # container route to fall back to — and on a hosted runner that varies between machines.
          if ($out -notmatch "Java \(JDK 21\+\)\s+17") { throw "doctor did not report the JDK as 17" }
          if ($out -notmatch "too old") { throw "doctor did not apply the version floor to a JDK 17" }
          # And the Windows-only lookup, from the same output: a pass above could otherwise be
          # hiding detection that finds nothing at all.
          #
          # .Contains(), not -match. PowerShell's escape character is the backtick, so a backslash
          # in a double-quoted string survives verbatim - which means every backslash then reaches
          # the regex engine as an escape and a Windows path has to be doubled to match itself.
          # This assertion is about a literal path, so it is written as a literal comparison and
          # there is nothing left to get wrong.
          if (-not $out.Contains("PostgreSQL server binaries at C:\Program Files\PostgreSQL")) {
            throw "the Program Files search did not find PostgreSQL"
          }
          # Now the exit code, with the route pinned so the answer cannot depend on the machine.
          $env:MEDSYNC_MODE = "native"
          .\dist\MedSync-Setup.exe doctor | Out-Null
          $native = $LASTEXITCODE
          if ($native -eq 0) { throw "MEDSYNC_MODE=native on a JDK 17 should have been refused" }
          "MEDSYNC_MODE=native on a JDK 17 was refused with exit $native, which is correct"
          # And now the step has to say so out loud, because a `run:` block is wrapped by Actions in
          # a trailing `exit $LASTEXITCODE`. A step whose last native command failed on purpose
          # therefore fails itself, with no error text and nothing to point at - which is exactly
          # how this step failed once while every assertion in it had passed.
          exit 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # And now from the passing side, with the route still pinned to native so this asserts the
      # JDK and not the runner's Docker. doctor also exits non-zero when a port is occupied, which
      # on a fresh runner it is not, so a failure here is a real finding rather than noise.
      - name: doctor
        env:
          MEDSYNC_MODE: native
        run: |
          .\dist\MedSync-Setup.exe doctor
          if ($LASTEXITCODE -ne 0) { throw "doctor exited $LASTEXITCODE" }

      # A checkout beside the executable is used rather than downloaded over, and that is the more
      # important half of the two: somebody who has already cloned this and drops the .exe in must
      # get their own tree built, not a second copy fetched into AppData behind their back. The
      # first version of this step asserted a download here and failed - correctly, because dist\
      # is inside the repository and nothing needed downloading.
      - name: fetch prefers a checkout it is standing in
        run: |
          $out = .\dist\MedSync-Setup.exe fetch 2>&1 | Out-String
          $out
          if ($LASTEXITCODE -ne 0) { throw "fetch exited $LASTEXITCODE" }
          if (-not $out.Contains("Source: $env:GITHUB_WORKSPACE")) {
            throw "fetch did not resolve to this checkout"
          }
          if (Test-Path "$env:MEDSYNC_HOME\src") { throw "fetch downloaded a second copy anyway" }

      # And now the download itself: HTTPS, gzip, tar, the path-traversal guard and the strip of
      # GitHub's own wrapper directory, all against Windows path separators. It has to run from
      # outside the repository for the same reason the step above passes - both the executable's
      # directory and the working directory are searched for a checkout first, so a copy of the
      # .exe in the runner's temp, run from there, is the only way to reach this path.
      #
      # Skipped on pull requests: the ref there is a synthetic merge ref that codeload cannot
      # serve, so the step would fail for a reason that has nothing to do with the installer.
      - name: fetch downloads when there is no checkout
        if: github.event_name != 'pull_request'
        working-directory: ${{ runner.temp }}
        env:
          MEDSYNC_REF: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\bin" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\dist\MedSync-Setup.exe" "$env:RUNNER_TEMP\bin\MedSync-Setup.exe"
          & "$env:RUNNER_TEMP\bin\MedSync-Setup.exe" fetch
          if ($LASTEXITCODE -ne 0) { throw "fetch exited $LASTEXITCODE" }
          if (-not (Test-Path "$env:MEDSYNC_HOME\src\pom.xml")) { throw "no pom.xml in the fetched tree" }
          if (-not (Test-Path "$env:MEDSYNC_HOME\src\services\identity-service")) { throw "incomplete tree" }
          if (-not (Test-Path "$env:MEDSYNC_HOME\src\medsync.sh")) { throw "the tree is missing files" }
          $count = (Get-ChildItem "$env:MEDSYNC_HOME\src" -Recurse -File).Count
          "unpacked $count files"
          if ($count -lt 500) { throw "only $count files unpacked; the archive did not come through whole" }

      # The database ladder against the PostgreSQL that windows-latest ships stopped: initdb into
      # LocalAppData, pg_ctl start on a port of its own, then the two extensions. This is the rung
      # the Linux run cannot reach, because initdb refuses to run as root and CI containers are.
      - name: db (private cluster)
        run: |
          .\dist\MedSync-Setup.exe db
          if ($LASTEXITCODE -ne 0) { throw "db exited $LASTEXITCODE" }

      - name: The cluster is really there and really answers
        run: |
          $state = Get-Content "$env:MEDSYNC_HOME\state.json" | ConvertFrom-Json
          "mode=$($state.dbMode) port=$($state.dbPort) dir=$($state.dbDir)"
          if ($state.dbMode -ne "private") { throw "expected a private cluster, got '$($state.dbMode)'" }
          if (-not $state.phiKey) { throw "no PHI key was generated" }
          $psql = (Get-ChildItem "C:\Program Files\PostgreSQL\*\bin\psql.exe" | Select-Object -Last 1).FullName
          $env:PGPASSWORD = "hms"
          # The extensions are what `db` is really being asked about: without them the first
          # migration fails, and it fails minutes later inside a service log rather than here.
          $out = & $psql "postgresql://hms@127.0.0.1:$($state.dbPort)/hms" -tAc "select string_agg(extname, ',' order by extname) from pg_extension where extname in ('pg_trgm','btree_gist')"
          "extensions: $out"
          if ($out -notmatch "btree_gist" -or $out -notmatch "pg_trgm") { throw "the extensions are missing" }

      - name: status
        run: .\dist\MedSync-Setup.exe status

      # Removes the cluster it just made, which also exercises pg_ctl stop and the RemoveAll of
      # MEDSYNC_HOME. Piped "y" because uninstall asks first, deliberately.
      - name: uninstall
        run: |
          "y" | .\dist\MedSync-Setup.exe uninstall
          if (Test-Path "$env:MEDSYNC_HOME") { throw "$env:MEDSYNC_HOME survived uninstall" }

      - name: The logs, whatever happened
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-fast-logs
          path: ${{ runner.temp }}\medsync\logs
          if-no-files-found: ignore

  windows-full:
    name: Windows (the whole install)
    # Not on the push path. Dispatched with the box ticked, or nightly.
    #
    # `github.event.inputs.full` rather than `inputs.full`: the `inputs` context exists only for
    # workflow_dispatch and workflow_call, so naming it in a job-level `if` that a push also
    # evaluates fails the whole workflow before any job starts — "Unrecognized named-value:
    # 'inputs'", with no job to attribute it to. The event payload is readable on every event and
    # is simply null here. It arrives as a string, hence the comparison rather than a truth test.
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.full == 'true') || github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Build the installer
        working-directory: installer/windows
        run: go build -trimpath -ldflags "-s -w" -o ..\..\dist\MedSync-Setup.exe .

      - name: doctor
        run: .\dist\MedSync-Setup.exe doctor

      # The real thing, against this checkout rather than a download: findSource looks beside the
      # executable first, and dist\ is inside the repository, so this builds the commit under test
      # instead of whatever is on the branch.
      #
      # The rate limits are raised because the smoke test signs in and then makes seventeen
      # requests in a few seconds, which the auth bucket is sized to discourage. The limiter has its
      # own unit coverage in the gateway module, so raising it here costs no coverage.
      - name: up (build, start, smoke)
        env:
          MEDSYNC_HOME: ${{ runner.temp }}\medsync
          MEDSYNC_NO_BROWSER: "1"
          MEDSYNC_MODE: native
          HMS_RATE_LIMIT_AUTH_RPM: "5000"
          HMS_RATE_LIMIT_RPM: "100000"
        run: |
          .\dist\MedSync-Setup.exe up
          if ($LASTEXITCODE -ne 0) { throw "up exited $LASTEXITCODE" }

      # Twice on purpose. The first run is part of `up`; this one proves the platform is still
      # serving after the installer has exited, which is the whole question the detached-process
      # flags exist to answer — a stack that dies with the installer's console would pass the first
      # check and fail this one.
      - name: smoke, after the installer has exited
        env:
          MEDSYNC_HOME: ${{ runner.temp }}\medsync
        run: |
          .\dist\MedSync-Setup.exe smoke
          if ($LASTEXITCODE -ne 0) { throw "smoke exited $LASTEXITCODE" }

      - name: The seeded separations are real, not cosmetic
        run: |
          $login = @{ username = "cashier"; password = "ChangeMe!Dev2026" } | ConvertTo-Json
          $token = (Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8080/auth/login" -ContentType "application/json" -Body $login).accessToken
          if (-not $token) { throw "the cashier could not sign in" }
          # A cashier reading a chart must be refused by the service. If this ever answers 200, the
          # role separation the installer's own closing message advertises has stopped being true,
          # and the thing that prints that list should be the thing that notices.
          #
          # A bare catch that reads the status off the exception, rather than catching a named
          # exception type: Invoke-WebRequest throws System.Net.WebException under Windows
          # PowerShell 5.1 and HttpResponseException under PowerShell 7, and a typed catch naming
          # the wrong one turns a passing assertion into an unhandled error.
          $code = 0
          try {
            $r = Invoke-WebRequest -Uri "http://127.0.0.1:8080/encounters/00000000-0000-4000-8000-000000000000" -Headers @{ Authorization = "Bearer $token" } -UseBasicParsing -ErrorAction Stop
            $code = [int]$r.StatusCode
          } catch {
            if ($_.Exception.Response) { $code = [int]$_.Exception.Response.StatusCode }
          }
          "cashier on /encounters/{id} -> $code"
          if ($code -ne 403) { throw "expected 403, got $code" }

      - name: status
        env:
          MEDSYNC_HOME: ${{ runner.temp }}\medsync
        run: .\dist\MedSync-Setup.exe status

      - name: down
        env:
          MEDSYNC_HOME: ${{ runner.temp }}\medsync
        run: |
          .\dist\MedSync-Setup.exe down
          if ($LASTEXITCODE -ne 0) { throw "down exited $LASTEXITCODE" }

      # taskkill /T is the Windows answer to the defect the Unix script had, where killing the
      # recorded pid left next-server holding port 3000. Asserting the ports are free is how that
      # stays fixed rather than being fixed once.
      # A raw TcpClient rather than a networking cmdlet: the connect-or-refuse question is the whole
      # test, and going straight to .NET removes any dependence on which cmdlets this runner image
      # happens to have.
      - name: Every port is actually free
        run: |
          Start-Sleep -Seconds 5
          $stuck = @()
          foreach ($p in 3000,8080,8081,8082,8083,8084,8085,8086,8087,8088,8089,8090,8091) {
            $c = New-Object System.Net.Sockets.TcpClient
            try { $c.Connect("127.0.0.1", $p); $stuck += $p } catch { } finally { $c.Dispose() }
          }
          if ($stuck.Count -gt 0) { throw "still listening after down: $($stuck -join ', ')" }
          "every port is free"

      - name: The logs, whatever happened
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-full-logs
          path: ${{ runner.temp }}\medsync\logs
          if-no-files-found: ignore
