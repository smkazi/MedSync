# Builds the self-contained MedSync-Setup.exe and publishes it where a person can actually get it.
#
# Its own workflow rather than two more jobs in windows-installer.yml, and the reason is a real
# limitation rather than tidiness: that workflow's push trigger filters on `branches`, which a tag
# push does not match, and adding `tags` beside a `paths` filter does not work either — on a tag
# push GitHub evaluates `paths` against the commits included in the push, and a tag pointing at an
# already-pushed commit includes none, so the filter matches nothing and the workflow never runs.
# A separate file with a trigger that means what it says is the honest fix.
#
# What comes out of it: one .exe carrying a Java runtime, a Node runtime, a PostgreSQL server, an
# embeddable Python, every library, the built web app and the AI service. It installs nothing,
# downloads nothing and builds nothing on the machine it runs on.
#
# On windows-latest and not as a convenience. Two things in the payload are platform-specific and
# cannot be produced anywhere else: the Next.js standalone output pulls @next/swc-win32-x64-msvc,
# and the AI service's wheels are win_amd64. Assembling either on Linux means guessing, and the
# guess is only found to be wrong on somebody's laptop.

name: Release

on:
  push:
    # Every push to main publishes a release, which is the whole point of this file: a tag and an
    # installer are not two things here, they are one, so "tag it after each push" and "build the
    # installer after each push" are the same instruction.
    #
    # A tag still works, and a release branch still works, for a reason that is a permissions fact
    # rather than a preference. Pushing a tag needs a credential allowed to write refs/tags/*, and
    # not every credential that can push a branch has it — a push of refs/tags/v1.0.0 from this
    # repository's own automation answers 403 while refs/heads/* goes through. The workflow's own
    # GITHUB_TOKEN has contents: write and creates the tag when it publishes, so all three routes
    # produce the same release. main is simply the one that needs no extra ref at all.
    branches: [main, "release/**"]
    tags: ["v*"]
  # Nightly, so the payload build is exercised rather than first attempted on the day somebody
  # wants a release. 04:30 UTC — after the security workflow at 02:30 and the installer's own
  # nightly at 03:30, because three long jobs competing for runners means all three report late.
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------------------------------
  # What this release is called, worked out once and used by everything below.
  #
  # It runs first rather than inside `publish` because the version has to reach the compiler: the
  # installer prints it, and a binary that says 1.0.0 while sitting in the v1.0.3 release is a
  # binary that lies about itself. See the -X main.version ldflag in installer/windows/build.sh.
  # ------------------------------------------------------------------------------------------
  version:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: pick
        run: |
          ref='${{ github.ref }}'
          case "$ref" in
            refs/tags/*)
              tag="${ref#refs/tags/}" ;;
            refs/heads/release/*)
              tag="${ref#refs/heads/release/}" ;;
            refs/heads/main)
              # The next patch after the highest version that exists. `git ls-remote` rather than a
              # deep checkout: it asks the remote directly, so this needs no history at all.
              #
              # The grep is strict on purpose. This repository carries a malformed `v1.0.0.0` tag,
              # and a looser match would sort it above v1.0.0 and then fail to parse it into three
              # numbers - producing either a crash or, worse, a plausible wrong version.
              latest="$(git ls-remote --tags --refs origin 'v*' \
                        | sed 's|.*refs/tags/||' \
                        | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                        | sort -V | tail -1)"
              latest="${latest:-v0.0.0}"
              rest="${latest#v}"
              tag="v$(cut -d. -f1 <<<"$rest").$(cut -d. -f2 <<<"$rest").$(( $(cut -d. -f3 <<<"$rest") + 1 ))"
              echo "highest existing version tag: $latest" ;;
            *)
              echo "not a release ref: $ref" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "this run is $tag"

  payload:
    name: Self-contained installer (payload)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    # Read only: this job builds the exe and nothing else. Writing the release is the publish job's
    # business, and it only gets to do it after `bundled` has proved the exe is what it claims.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      # A JDK rather than a JRE: jlink is a JDK tool, and jlink is how the 180 MB runtime becomes
      # a 60 MB one carrying only the modules the services actually load.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the installer binary
        shell: bash
        # The version reaches the binary here and nowhere else - build.sh turns it into an
        # -X main.version ldflag. Without it the exe would report whatever string was last typed
        # into main.go, which stops being true at the first release after that edit.
        env:
          MEDSYNC_VERSION: ${{ needs.version.outputs.tag }}
        run: bash installer/windows/build.sh

      # One bash script for both targets, and the Linux run of it is what makes this a re-run
      # rather than a first run. windows-latest ships Git for Windows, so bash is here.
      - name: Assemble the payload
        shell: bash
        run: bash installer/payload/build-payload.sh --os windows

      - name: Append the payload to the executable
        shell: bash
        run: |
          bash installer/payload/append-payload.sh \
            dist/MedSync-Setup.exe installer/payload/build/windows/payload.zip \
            dist/MedSync-Setup-bundled.exe
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: MedSync-Setup-selfcontained
          path: |
            dist/MedSync-Setup-bundled.exe
            dist/README.txt
          retention-days: 30


  # ------------------------------------------------------------------------------------------
  # The proof, and it is a different claim from "it started".
  #
  # Anything can start on a runner that already has Java, Node and PostgreSQL installed — that is
  # exactly how a bundle with a missing component passes a green test and then fails on the first
  # real machine. So this job removes all three from PATH first, and then asserts that the images
  # actually running came out of the runtime the installer unpacked.
  # ------------------------------------------------------------------------------------------
  bundled:
    name: Prove it uses nothing from the machine
    needs: [version, payload]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MedSync-Setup-selfcontained
          path: dist

      # Strip every toolchain the installer must not be allowed to borrow.
      #
      # By what a directory CONTAINS, not by what it is called. The first version matched directory
      # names against 'jdk|java|node|maven|postgres|pgsql|python' and missed the one that matters
      # most on Windows: python.exe also lives in
      # %LOCALAPPDATA%\Microsoft\WindowsApps as a Store app-execution alias, a path with none of
      # those words in it. The next step caught it - "python is still on PATH - this job would
      # prove nothing" - which is exactly what that step is for, and the lesson is that a filter
      # guessing from names cannot be trusted to empty a PATH.
      - name: Strip every toolchain from PATH
        shell: pwsh
        run: |
          $targets = @(
            'java.exe', 'javaw.exe',
            'node.exe', 'npm.cmd', 'npm.exe', 'npx.cmd',
            'mvn.cmd', 'mvn.exe',
            'psql.exe', 'initdb.exe', 'postgres.exe', 'pg_ctl.exe',
            'python.exe', 'python3.exe', 'py.exe'
          )
          $keep = @()
          foreach ($part in $env:PATH -split ';') {
            if (-not $part) { continue }
            $found = $null
            foreach ($t in $targets) {
              if (Test-Path -LiteralPath (Join-Path $part $t)) { $found = $t; break }
            }
            if ($found) { Write-Host "removing from PATH (has $found): $part" }
            else { $keep += $part }
          }
          $stripped = ($keep -join ';')
          "PATH=$stripped" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Cleared as well, because a JVM found through JAVA_HOME is a JVM found from the machine
          # whether or not PATH mentions it.
          "JAVA_HOME=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PYTHONHOME=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PYTHONPATH=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Nothing is on PATH any more
        shell: pwsh
        run: |
          $stillThere = @()
          foreach ($tool in @('java','node','npm','mvn','psql','initdb','postgres','python','py')) {
            $found = Get-Command $tool -ErrorAction SilentlyContinue
            if ($found) {
              $stillThere += "$tool -> $($found.Source)"
              Write-Host "STILL ON PATH: $tool -> $($found.Source)"
            } else {
              Write-Host "$tool : not on PATH, as intended"
            }
          }
          # All of them at once rather than the first one, because "python is still there" and
          # "python and java are still there" call for different fixes and one throw hides the
          # difference.
          if ($stillThere.Count -gt 0) {
            throw "this job would prove nothing while these resolve: $($stillThere -join '; ')"
          }

      # The exe has to agree with the release it is about to be attached to. Cheap to check and
      # the only place the ldflags injection can be caught failing before somebody downloads a
      # 300 MB file that misreports itself.
      - name: The binary knows which version it is
        shell: pwsh
        run: |
          $expected = '${{ needs.version.outputs.tag }}'.TrimStart('v')
          $out = & dist\MedSync-Setup-bundled.exe version 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch [regex]::Escape($expected)) {
            throw "the installer reports a different version than this release: expected $expected"
          }

      - name: doctor reports a complete payload
        shell: pwsh
        run: |
          $out = & dist\MedSync-Setup-bundled.exe doctor 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'Bundled') { throw "doctor did not report the bundled route" }
          if ($out -match 'prerequisite\(s\) missing') { throw "doctor asked for something to be installed" }

      - name: up — install, start and smoke-test, with nothing on the machine
        shell: pwsh
        env:
          MEDSYNC_NO_BROWSER: "1"
        run: |
          & dist\MedSync-Setup-bundled.exe up
          if ($LASTEXITCODE -ne 0) { throw "up failed with $LASTEXITCODE" }

      # The assertion that separates self-contained from lucky. Every running image must live
      # under the runtime this installer unpacked; one java.exe from Program Files means the
      # payload was incomplete and the machine quietly filled the gap.
      - name: Every running process came out of the payload
        shell: pwsh
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'MedSync\runtime'
          $names = @('java','node','postgres')
          $bad = @()
          foreach ($name in $names) {
            $procs = Get-Process -Name $name -ErrorAction SilentlyContinue
            if (-not $procs) { throw "no $name process is running - the platform is not up" }
            foreach ($p in $procs) {
              $path = $p.Path
              Write-Host "$name -> $path"
              if ($path -notlike "$root*") { $bad += "$name at $path" }
            }
          }
          if ($bad.Count -gt 0) { throw "processes running from outside the payload: $($bad -join '; ')" }
          Write-Host "every java.exe, node.exe and postgres.exe is running from $root"

      - name: down, then uninstall, and nothing is left
        shell: pwsh
        run: |
          & dist\MedSync-Setup-bundled.exe down
          $env:MEDSYNC_ASSUME_YES = '1'
          & dist\MedSync-Setup-bundled.exe uninstall
          $home_dir = Join-Path $env:LOCALAPPDATA 'MedSync'
          if (Test-Path $home_dir) { throw "$home_dir survived uninstall" }
          Write-Host "nothing left behind"

      - name: The logs, whatever happened
        if: always()
        shell: pwsh
        run: |
          $logs = Join-Path $env:LOCALAPPDATA 'MedSync\logs'
          if (Test-Path $logs) { Get-ChildItem $logs | ForEach-Object { Write-Host "=== $($_.Name) ==="; Get-Content $_.FullName -Tail 40 } }

  # ------------------------------------------------------------------------------------------
  # The stable URL, and deliberately the LAST thing that happens.
  #
  # A CI artifact expires and needs a GitHub login; a release asset does neither, which is the
  # whole point — "provide a link to download the exe" has been asked once in this project already
  # and could not be answered. But publishing it from inside the build job, which is where this
  # started, would put the download up before anything had checked it: `bundled` runs after, so a
  # payload missing a runtime would be a published payload missing a runtime.
  #
  # So the release waits for the proof. If the exe turns out to use anything from the machine it
  # runs on, there is no release at all rather than a bad one with a note attached.
  # ------------------------------------------------------------------------------------------
  publish:
    name: Publish the release
    needs: [version, payload, bundled]
    # `github.event_name == 'push'` matters: on the nightly schedule github.ref is also
    # refs/heads/main, and without this the 04:30 run would mint a new version every night for a
    # tree nobody had changed. The nightly still builds the payload and still runs the proof -
    # which is what it is for - it just does not publish.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main'
        || startsWith(github.ref, 'refs/tags/')
        || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MedSync-Setup-selfcontained
          path: dist

      - name: What is being published
        run: |
          ls -la dist/
          echo "publishing as ${{ needs.version.outputs.tag }}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MedSync ${{ needs.version.outputs.tag }}
          files: |
            dist/MedSync-Setup-bundled.exe
            dist/README.txt
          fail_on_unmatched_files: true
          generate_release_notes: false
          body: |
            ## MedSync — one file, nothing to install

            Download **MedSync-Setup-bundled.exe** and double-click it. It installs nothing on the
            machine, downloads nothing, and builds nothing. There is no JDK to install, no Node, no
            Maven, no PostgreSQL, no Python, no Docker, and no network connection needed after the
            download itself.

            Everything is inside the file:

            | | |
            | --- | --- |
            | Java runtime | Temurin 21, jlinked to the modules the services load |
            | Node runtime | Node 22 |
            | PostgreSQL | 16, server and client |
            | Python | 3.11 with the AI service's packages |
            | The platform | twelve services, the web app, the AI service and its trained model |
            | Libraries | every one, 185 distinct jars |
            | Licences | each component's own text, plus THIRD-PARTY-NOTICES.txt |

            Windows will warn you before it runs, because the file is not code-signed — a signing
            certificate has to be bought and held by a company. Click **More info**, then
            **Run anyway**. If you would rather not, that is a reasonable position; build it
            yourself from source instead.

            Everything it creates lives in `%LOCALAPPDATA%\MedSync`, and
            `MedSync-Setup-bundled.exe uninstall` removes all of it. Nothing is written to the
            registry, no service is registered, nothing starts at boot.

            **How this build was checked.** Before this release was published, a job on a clean
            Windows runner removed Java, Node, Maven, PostgreSQL and Python from `PATH`, confirmed
            none of them resolved any more, ran a full install, and then asserted that every
            running `java.exe`, `node.exe` and `postgres.exe` had its image inside the unpacked
            payload. A single process from `Program Files` fails that job and there is no release.

            `README.txt` beside the exe has the demo accounts and a walkthrough.
