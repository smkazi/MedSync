spring:
  application:
    name: laboratory-service
  datasource:
    url: ${HMS_DB_URL:jdbc:postgresql://localhost:5432/hms}
    username: ${HMS_DB_USER:hms}
    password: ${HMS_DB_PASSWORD:hms}
    hikari:
      # The connection budget, stated rather than left to a default. Hikari's default of ten per
      # service is an arithmetic trap for a platform of eleven: 110 connections against a default
      # max_connections of 100, and the failure is the eleventh service refusing to start with
      # "sorry, too many clients already". Five each, leaving room for Flyway's own connection at
      # startup, the test suites, and somebody opening psql while the stack is up.
      maximum-pool-size: ${HMS_DB_POOL_MAX:5}
      minimum-idle: ${HMS_DB_POOL_MIN:1}
      # Sets the connection's search_path. Hibernate's default_schema only qualifies mapped
      # entities, so native SQL (the MRN sequence) needs the schema on the connection itself.
      schema: laboratory
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: laboratory
        jdbc:
          time_zone: UTC
  flyway:
    # Migrations run as a role that owns the schemas and holds DDL; the runtime credential
    # above has none. Defaults to the datasource credential, so a deployment that has not
    # run scripts/db-roles.sql behaves exactly as it did before the split existed.
    user: ${HMS_DB_MIGRATION_USER:${HMS_DB_USER:hms}}
    password: ${HMS_DB_MIGRATION_PASSWORD:${HMS_DB_PASSWORD:hms}}
    enabled: true
    schemas: laboratory
    default-schema: laboratory
    create-schemas: true
  kafka:
    bootstrap-servers: ${HMS_KAFKA:localhost:9092}

server:
  port: ${HMS_LABORATORY_PORT:8084}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

hms:
  security:
    mode: resource-server
  events:
    transport: ${HMS_EVENTS_TRANSPORT:log}
  scheduling:
    # Where the care team lives, and therefore where "is this your patient" is answered. Every call
    # forwards the caller's own token, so this service can only ask about the clinician making the
    # request.
    base-url: ${HMS_SCHEDULING_URI:http://localhost:8083}
  care-team:
    # The narrowing on patient records. On by default and configurable, because a deployment that
    # has not populated its care teams -- an existing database, a pilot -- would otherwise refuse
    # every clinician every record until somebody worked out why.
    narrow-patient-records: ${HMS_NARROW_PATIENT_RECORDS:true}
  laboratory:
    accession-prefix: ${HMS_ACCESSION_PREFIX:L}
  patient:
    # The register, for the name a report is printed under. Every call forwards the caller's own
    # token, so this is an address rather than a credential.
    base-url: ${HMS_PATIENT_URI:http://localhost:8082}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri: ${HMS_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
