spring:
  application:
    name: interop-service
  datasource:
    url: ${HMS_DB_URL:jdbc:postgresql://localhost:5432/hms}
    username: ${HMS_DB_USER:hms}
    password: ${HMS_DB_PASSWORD:hms}
    hikari:
      schema: interop
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: interop
        jdbc:
          time_zone: UTC
  flyway:
    # Migrations run as a role that owns the schemas and holds DDL; the runtime credential
    # above has none. Defaults to the datasource credential, so a deployment that has not
    # run scripts/db-roles.sql behaves exactly as it did before the split existed.
    user: ${HMS_DB_MIGRATION_USER:${HMS_DB_USER:hms}}
    password: ${HMS_DB_MIGRATION_PASSWORD:${HMS_DB_PASSWORD:hms}}
    enabled: true
    schemas: interop
    default-schema: interop
    create-schemas: true
  kafka:
    bootstrap-servers: ${HMS_KAFKA:localhost:9092}

server:
  port: ${HMS_INTEROP_PORT:8089}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

hms:
  security:
    mode: resource-server
  events:
    transport: ${HMS_EVENTS_TRANSPORT:log}
  # Where the data a bundle is built from lives. Every call forwards the caller's own token, so
  # these are addresses rather than credentials.
  patient:
    base-url: ${HMS_PATIENT_URI:http://localhost:8082}
  scheduling:
    base-url: ${HMS_SCHEDULING_URI:http://localhost:8083}
  laboratory:
    base-url: ${HMS_LABORATORY_URI:http://localhost:8084}
  pharmacy:
    base-url: ${HMS_PHARMACY_URI:http://localhost:8087}
  interop:
    # What this deployment calls itself in a FHIR bundle's Organization and in an ABDM handshake.
    # Not a hospital's name in this repository: a deployment sets it, and the default says plainly
    # that nobody has.
    facility-name: ${HMS_FACILITY_NAME:An unnamed clinical establishment}
    facility-id: ${HMS_FACILITY_ID:UNSET}
    # The base every FHIR resource's fullUrl is built from. urn:uuid by default, which is what a
    # bundle that is not served from a FHIR endpoint should use -- claiming a resolvable base URL
    # the platform does not serve would be a lie a receiving system can follow.
    fhir-base: ${HMS_FHIR_BASE:urn:uuid:}
    # How long a consent may be granted for at most. A permission to read somebody's medical record
    # is not the kind of thing anybody should be able to sign away for a decade by typing a date.
    max-consent-days: ${HMS_MAX_CONSENT_DAYS:180}
    # The zone a day is bounded in when somebody asks the disclosure register what left "in
    # September". Defaults from HMS_ZONE, the one variable a deployment sets: three services bound
    # a day -- this one, the audit report and the billing day book -- and they have to agree, or a
    # patient's accounting and the hospital's report disagree about the same afternoon.
    zone: ${HMS_INTEROP_ZONE:${HMS_ZONE:Asia/Kolkata}}
    # Which ABDM gateway adapter runs. LOG records what would have been sent and sends nothing,
    # which is the honest default for a platform with no NHA credentials: see the README.
    gateway: ${HMS_ABDM_GATEWAY:LOG}
    gateway-url: ${HMS_ABDM_GATEWAY_URL:}
    # How the HTTP adapter authenticates, if it does. Generic for the reason the SMS adapter is:
    # every bridge in front of ABDM wants a different header, and compiling one vendor's into the
    # platform would make the module wrong for the next deployment.
    gateway-auth-header: ${HMS_ABDM_GATEWAY_AUTH_HEADER:Authorization}
    gateway-auth-value: ${HMS_ABDM_GATEWAY_AUTH_VALUE:}
    hl7:
      # How this platform names itself in MSH-3 and MSH-4. A receiver routes on these, and two
      # deployments both calling themselves HMS is a message filed against the wrong hospital.
      application: ${HMS_HL7_APPLICATION:HMS}
      facility: ${HMS_HL7_FACILITY:${HMS_FACILITY_NAME:HMS}}
      # MSH-11. P is production and T is test, and a receiver is entitled to route on it -- a test
      # message marked P is one somebody acts on.
      processing-id: ${HMS_HL7_PROCESSING_ID:P}
      # HL7 v2 predates UTF-8 and plenty of senders are still on Latin-1. Configurable rather than
      # assumed: decoding a name with the wrong charset corrupts it silently.
      charset: ${HMS_HL7_CHARSET:UTF-8}
      connect-timeout-ms: ${HMS_HL7_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${HMS_HL7_READ_TIMEOUT_MS:15000}
      mllp:
        # Off unless a deployment says otherwise, and the default is the point: this is a raw TCP
        # port that accepts clinical messages, and MLLP has no authentication of any kind. Opening
        # it is a network decision somebody should have to make on purpose. The HTTP endpoint does
        # the same work behind the gateway, with a bearer token.
        enabled: ${HMS_HL7_MLLP_ENABLED:false}
        port: ${HMS_HL7_MLLP_PORT:2575}
        threads: ${HMS_HL7_MLLP_THREADS:8}
        # A sender that never terminates a frame would otherwise buffer without bound.
        max-message-bytes: ${HMS_HL7_MLLP_MAX_BYTES:1048576}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri: ${HMS_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
