spring:
  application:
    name: gateway
  main:
    # Stated, not inferred. Spring Cloud Gateway is reactive, but the parent POM puts
    # spring-boot-starter-webmvc-test on every module's test classpath for MockMvc, and Boot's
    # auto-detection picks servlet the moment spring-webmvc appears - which starts a servlet
    # container with no WebFluxProperties bean and fails every gateway bean at once. Pinning it
    # here means the classpath cannot decide this for us.
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          # The browser is the only client, and it needs the correlation header back.
          httpclient:
            connect-timeout: 2000
            response-timeout: 30s
  webflux:
    base-path: /

server:
  port: ${HMS_GATEWAY_PORT:8080}

hms:
  rate-limit:
    # Per-client, per-minute, counted in this JVM. 600/min is roughly ten requests a second, which
    # a browser loading a busy worklist can reach in a burst and a human cannot sustain.
    enabled: ${HMS_RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${HMS_RATE_LIMIT_RPM:600}
    # Far stricter, because nobody signs in twenty times a minute. This is what makes password
    # spraying - one password against many usernames - impractical; per-account lockout in
    # identity-service handles the other shape of the attack.
    auth-requests-per-minute: ${HMS_RATE_LIMIT_AUTH_RPM:20}
    # Its own bucket, and generous: a wall display polls, and the corridor board is a room code
    # and a handful of numbers. Sharing the general bucket would let one waiting-room screen
    # exhaust the allowance for every clinician behind the same NAT address.
    public-requests-per-minute: ${HMS_RATE_LIMIT_PUBLIC_RPM:3000}
    # The patient portal: a fifth of the general limit, and its own counter. Nothing a patient does
    # looks like a clinician loading a worklist, and the portal is the only authenticated surface a
    # stranger can obtain a session on by asking at a desk -- so it neither needs the general
    # allowance nor should be able to spend it for the clinicians behind the same NAT address.
    portal-requests-per-minute: ${HMS_RATE_LIMIT_PORTAL_RPM:120}
  services:
    identity: ${HMS_IDENTITY_URI:http://localhost:8081}
    patient: ${HMS_PATIENT_URI:http://localhost:8082}
    scheduling: ${HMS_SCHEDULING_URI:http://localhost:8083}
    laboratory: ${HMS_LABORATORY_URI:http://localhost:8084}
    notification: ${HMS_NOTIFICATION_URI:http://localhost:8085}
    admissions: ${HMS_ADMISSIONS_URI:http://localhost:8086}
    pharmacy: ${HMS_PHARMACY_URI:http://localhost:8087}
    billing: ${HMS_BILLING_URI:http://localhost:8088}
    interop: ${HMS_INTEROP_URI:http://localhost:8089}
    imaging: ${HMS_IMAGING_URI:http://localhost:8090}
    immunisation: ${HMS_IMMUNISATION_URI:http://localhost:8091}
    ai: ${HMS_AI_URI:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
