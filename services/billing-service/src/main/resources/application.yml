spring:
  application:
    name: billing-service
  datasource:
    url: ${HMS_DB_URL:jdbc:postgresql://localhost:5432/hms}
    username: ${HMS_DB_USER:hms}
    password: ${HMS_DB_PASSWORD:hms}
    hikari:
      # The connection budget, stated rather than left to a default.
      #
      # Hikari defaults to ten connections per service. That is a fine number for one service and
      # an arithmetic trap for a platform of them: eleven Java services against one PostgreSQL is
      # 110 connections against a default max_connections of 100, and the failure is not a slow
      # query -- it is the eleventh service refusing to start with "sorry, too many clients
      # already", which is how this comment came to be written.
      #
      # Five each because these are request-scoped reads and writes rather than long transactions,
      # and because the budget has to leave room for what else connects: Flyway takes its own
      # connection at startup, the test suites take theirs, and somebody needs to be able to open
      # psql while the stack is up. Eleven fives is 55 of 100 -- and every service is
      # on it, including the one with no other reason to have a hikari block.
      maximum-pool-size: ${HMS_DB_POOL_MAX:5}
      minimum-idle: ${HMS_DB_POOL_MIN:1}
      schema: billing
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: billing
        jdbc:
          time_zone: UTC
  flyway:
    # Migrations run as a role that owns the schemas and holds DDL; the runtime credential
    # above has none. Defaults to the datasource credential, so a deployment that has not
    # run scripts/db-roles.sql behaves exactly as it did before the split existed.
    user: ${HMS_DB_MIGRATION_USER:${HMS_DB_USER:hms}}
    password: ${HMS_DB_MIGRATION_PASSWORD:${HMS_DB_PASSWORD:hms}}
    enabled: true
    schemas: billing
    default-schema: billing
    create-schemas: true
  kafka:
    bootstrap-servers: ${HMS_KAFKA:localhost:9092}

server:
  port: ${HMS_BILLING_PORT:8088}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

hms:
  security:
    mode: resource-server
  events:
    transport: ${HMS_EVENTS_TRANSPORT:log}
  billing:
    # The tax the platform assumes when a charge item names no rate of its own.
    #
    # GST-exempt by default, and that is a decision rather than a placeholder: healthcare services
    # provided by a clinical establishment are exempt in India, so the common case for a hospital's
    # charge list is no tax at all. A deployment that charges tax on something taxable — a
    # pharmacy sale, a consumable, a non-clinical service — names the rate on the charge item, and
    # the rate itself is a row with effective dates because rates change by statute.
    default-tax-rate: ${HMS_DEFAULT_TAX_RATE:}
    # The prefix an invoice number carries. Numbers are per financial year and sequential.
    invoice-prefix: ${HMS_INVOICE_PREFIX:INV}
    # The zone a day is cashed up in. A payment's timestamp is an instant, and "the 14th" is a
    # different window in Kolkata than in UTC -- a hospital counting its drawer at 8pm local would
    # otherwise find the evening's takings in tomorrow's day book.
    zone: ${HMS_BILLING_ZONE:${HMS_ZONE:Asia/Kolkata}}
    capture:
      # What a clinical event is charged as. Configuration rather than code, because the codes
      # belong to a deployment's own charge list: these are the ones the seed migration ships, and
      # a deployment with a different list points these at its own codes instead of editing Java.
      #
      # A code naming nothing in the charge list is reported in the log and charged to nobody. That
      # is deliberate: substituting a plausible price would put a number on an invoice that nobody
      # chose, and throwing would stall the consumer group and stop every later charge too.
      consultation-code: ${HMS_CHARGE_CONSULTATION:CONSULT_OP}
      casualty-code: ${HMS_CHARGE_CASUALTY:CASUALTY}
      # A released test is billed as `<prefix><test code>` when the charge list has such an item,
      # and as the fallback panel when it does not -- so pricing an individual test is a row a
      # deployment adds, not a code change.
      lab-code-prefix: ${HMS_CHARGE_LAB_PREFIX:LAB_}
      lab-fallback-code: ${HMS_CHARGE_LAB_FALLBACK:LAB_PANEL}
      dispense-fallback-code: ${HMS_CHARGE_DISPENSE:PHARM_DISP}
      bed-day-code: ${HMS_CHARGE_BED_DAY:BED_GEN}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri: ${HMS_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
