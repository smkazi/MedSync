# Integration tests run against a real PostgreSQL. The safety rules here are database constraints —
# one dose one record, an ordered-pair CHECK on the interaction table, a stock quantity that cannot
# go negative — and there is no in-memory substitute that enforces them.
spring:
  datasource:
    url: ${HMS_TEST_DB_URL:jdbc:postgresql://localhost:5432/hms_test}
    username: ${HMS_TEST_DB_USER:hms}
    password: ${HMS_TEST_DB_PASSWORD:hms}
    hikari:
      schema: pharmacy
  flyway:
    enabled: true
# The care-team narrowing on patient records is off for this module's suite, and that is a
# statement rather than a convenience. It asks scheduling-service "is this your patient", and
# scheduling-service is not running in a laboratory unit test -- so with it on, the client would
# fail closed and every clinician read here would be a 403 about the wrong thing entirely. The
# narrowing has a suite of its own (CareRelationshipNarrowingTest) that stands up a stub and
# proves both directions, including that an unreachable scheduling-service refuses rather than
# opens.
hms:
  care-team:
    narrow-patient-records: false
  events:
    transport: log
logging:
  level:
    org.flywaydb: WARN
