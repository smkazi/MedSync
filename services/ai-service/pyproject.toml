[project]
name = "hms-ai-service"
version = "0.1.0"
description = "Clinical decision support for the hospital management platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic>=0.40",
    "scikit-learn>=1.5",
    "numpy>=2.0",
    "joblib>=1.4",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "bandit>=1.7",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# S = flake8-bandit security rules; this service handles clinical text and tokens.
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF", "BLE", "PLW"]
ignore = [
    "S101",  # assert is fine in tests
    # Depends(...) in a parameter default is FastAPI's dependency-injection idiom, not the
    # mutable-default bug B008 exists to catch.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
