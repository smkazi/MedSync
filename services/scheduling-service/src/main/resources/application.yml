spring:
  application:
    name: scheduling-service
  datasource:
    url: ${HMS_DB_URL:jdbc:postgresql://localhost:5432/hms}
    username: ${HMS_DB_USER:hms}
    password: ${HMS_DB_PASSWORD:hms}
    hikari:
      # Sets the connection's search_path. Hibernate's default_schema only qualifies mapped
      # entities, so native SQL (the MRN sequence) needs the schema on the connection itself.
      schema: scheduling
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: scheduling
        jdbc:
          time_zone: UTC
  flyway:
    # Migrations run as a role that owns the schemas and holds DDL; the runtime credential
    # above has none. Defaults to the datasource credential, so a deployment that has not
    # run scripts/db-roles.sql behaves exactly as it did before the split existed.
    user: ${HMS_DB_MIGRATION_USER:${HMS_DB_USER:hms}}
    password: ${HMS_DB_MIGRATION_PASSWORD:${HMS_DB_PASSWORD:hms}}
    enabled: true
    schemas: scheduling
    default-schema: scheduling
    create-schemas: true
  kafka:
    bootstrap-servers: ${HMS_KAFKA:localhost:9092}

server:
  port: ${HMS_SCHEDULING_PORT:8083}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

hms:
  patient:
    # Where the facility directory lives. Room codes are validated against it at booking time.
    base-url: ${HMS_PATIENT_URI:http://localhost:8082}
  laboratory:
    # Applying an order set raises the tests it names here, with the clinician's own token.
    base-url: ${HMS_LABORATORY_URI:http://localhost:8084}
  pharmacy:
    # And the medicines here. The prescription is raised first, because it is the step that can be
    # refused on clinical grounds — see OrderingClient for why the order of the two matters.
    base-url: ${HMS_PHARMACY_URI:http://localhost:8087}
  security:
    mode: resource-server
    # The corridor display, and the only unauthenticated path in the platform.
    #
    # `hms.security.public-paths` has existed since hms-common was written and had no user until
    # now, which is the right order: the allowlist was built before anything needed it, so nothing
    # had to be loosened to add this. What sits behind it returns a room code and some numbers -
    # there is no name, MRN or id in `PublicQueueBoard` to return - and the ZAP baseline asserts a
    # 200 here without a token *and* that nothing name-shaped comes back with it.
    public-paths: /public/**
  events:
    transport: ${HMS_EVENTS_TRANSPORT:log}
  scheduling:
    # Clinic hours are local; slots are generated in this zone and stored as instants.
    zone: ${HMS_TIMEZONE:UTC}
  ai:
    base-url: ${HMS_AI_URI:http://localhost:8000}
    enabled: ${HMS_AI_ENABLED:true}

# A decision-support outage must degrade the no-show badge, never block a booking.
resilience4j:
  circuitbreaker:
    instances:
      aiService:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
  timelimiter:
    instances:
      aiService:
        timeoutDuration: 2s
        cancelRunningFuture: true

spring.security.oauth2.resourceserver.jwt.jwk-set-uri: ${HMS_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
