spring:
  application:
    name: scheduling-service
  datasource:
    url: ${HMS_DB_URL:jdbc:postgresql://localhost:5432/hms}
    username: ${HMS_DB_USER:hms}
    password: ${HMS_DB_PASSWORD:hms}
    hikari:
      # The connection budget, stated rather than left to a default. Hikari's default of ten per
      # service is an arithmetic trap for a platform of eleven: 110 connections against a default
      # max_connections of 100, and the failure is the eleventh service refusing to start with
      # "sorry, too many clients already". Five each, leaving room for Flyway's own connection at
      # startup, the test suites, and somebody opening psql while the stack is up.
      maximum-pool-size: ${HMS_DB_POOL_MAX:5}
      minimum-idle: ${HMS_DB_POOL_MIN:1}
      # Sets the connection's search_path. Hibernate's default_schema only qualifies mapped
      # entities, so native SQL (the MRN sequence) needs the schema on the connection itself.
      schema: scheduling
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: scheduling
        jdbc:
          time_zone: UTC
  flyway:
    # Migrations run as a role that owns the schemas and holds DDL; the runtime credential
    # above has none. Defaults to the datasource credential, so a deployment that has not
    # run scripts/db-roles.sql behaves exactly as it did before the split existed.
    user: ${HMS_DB_MIGRATION_USER:${HMS_DB_USER:hms}}
    password: ${HMS_DB_MIGRATION_PASSWORD:${HMS_DB_PASSWORD:hms}}
    enabled: true
    schemas: scheduling
    default-schema: scheduling
    create-schemas: true
  kafka:
    bootstrap-servers: ${HMS_KAFKA:localhost:9092}

server:
  port: ${HMS_SCHEDULING_PORT:8083}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

hms:
  patient:
    # Where the facility directory lives. Room codes are validated against it at booking time.
    base-url: ${HMS_PATIENT_URI:http://localhost:8082}
  laboratory:
    # Applying an order set raises the tests it names here, with the clinician's own token.
    base-url: ${HMS_LABORATORY_URI:http://localhost:8084}
  pharmacy:
    # And the medicines here. The prescription is raised first, because it is the step that can be
    # refused on clinical grounds — see OrderingClient for why the order of the two matters.
    base-url: ${HMS_PHARMACY_URI:http://localhost:8087}
  interop:
    # The disclosure register, written before a line list naming patients is produced.
    #
    # The one outbound call on this platform whose failure cancels the work rather than degrading
    # it: if this is unreachable the request answers 503 and no file exists. See
    # DisclosureRegisterClient for why the two writes are in that order and what the residual is.
    base-url: ${HMS_INTEROP_URI:http://localhost:8089}
  surveillance:
    # Who the line list is for, recorded on every disclosure row it writes.
    #
    # Configuration and not a request parameter, deliberately. `recipient` is the column a patient
    # reads when they ask who has seen their record, and a recipient typed into a form is a column
    # somebody can fill with anything -- including a name that makes an unlawful disclosure read as
    # a statutory one. A deployment notifies the authority it is licensed under, that authority is a
    # property of the deployment, and it changes about as often as the licence does.
    authority: ${HMS_SURVEILLANCE_AUTHORITY:District public health authority}
    # How small a count may be before the notifiable return withholds it.
    #
    # ZERO -- off -- and that is the shipped default rather than a placeholder. A statutory return
    # needs exact counts: a district filing "fewer than five" cannot be aggregated upward by whoever
    # receives it, and a threshold applied silently would understate an outbreak. The mechanism is
    # here because the risk is real -- a rare condition in a small population is re-identifying by
    # arithmetic -- and a deployment publishing these numbers more widely than to its own authority
    # sets it. The same posture as the ABDM gateway and the imaging store: the decision written
    # down, the mechanism present, and the default honest about which one is in force.
    #
    # When it bites, the count is withheld as null rather than rendered as zero, and the report says
    # so. A suppressed count and no cases are different facts.
    small-cell-threshold: ${HMS_SURVEILLANCE_SMALL_CELL:0}
  security:
    mode: resource-server
    # The corridor display, and the only unauthenticated path in the platform.
    #
    # `hms.security.public-paths` has existed since hms-common was written and had no user until
    # now, which is the right order: the allowlist was built before anything needed it, so nothing
    # had to be loosened to add this. What sits behind it returns a room code and some numbers -
    # there is no name, MRN or id in `PublicQueueBoard` to return - and the ZAP baseline asserts a
    # 200 here without a token *and* that nothing name-shaped comes back with it.
    public-paths: /public/**
  events:
    transport: ${HMS_EVENTS_TRANSPORT:log}
  scheduling:
    # Clinic hours are local; slots are generated in this zone and stored as instants.
    #
    # Defaults from HMS_ZONE, like the billing day book, the audit report and the disclosure
    # register. It used to read ${HMS_TIMEZONE:UTC} -- a different variable and a different
    # default from every other date-bounding thing on the platform -- which meant a compose
    # deployment ran scheduling in UTC while the other three fell back to Asia/Kolkata. Two zones
    # in one deployment, and the surveillance report was about to bound a statutory week with
    # this one.
    zone: ${HMS_SCHEDULING_ZONE:${HMS_ZONE:Asia/Kolkata}}
  care-team:
    # How long break-glass cover lasts. One shift: covering somebody else's patient for an evening
    # should not become standing access to their record for ever, and an expired membership is
    # treated as absent rather than as present-and-ignored.
    break-glass-ttl: ${HMS_BREAK_GLASS_TTL:PT12H}
    # The floor on a break-glass reason. Blunt, and here for a blunt reason: "cover" and "emergency"
    # are what a free-text box collects when it does not ask for a sentence, and a reason nobody can
    # act on is the same as no reason.
    reason-min-length: ${HMS_BREAK_GLASS_REASON_MIN:20}
  ai:
    base-url: ${HMS_AI_URI:http://localhost:8000}
    enabled: ${HMS_AI_ENABLED:true}

# A decision-support outage must degrade the no-show badge, never block a booking.
resilience4j:
  circuitbreaker:
    instances:
      aiService:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
  timelimiter:
    instances:
      aiService:
        timeoutDuration: 2s
        cancelRunningFuture: true

spring.security.oauth2.resourceserver.jwt.jwk-set-uri: ${HMS_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
