spring:
  application:
    name: identity-service
  datasource:
    url: ${HMS_DB_URL:jdbc:postgresql://localhost:5432/hms}
    username: ${HMS_DB_USER:hms}
    password: ${HMS_DB_PASSWORD:hms}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: identity
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: identity
    default-schema: identity
    create-schemas: true
  kafka:
    bootstrap-servers: ${HMS_KAFKA:localhost:9092}
    consumer:
      auto-offset-reset: earliest

server:
  port: ${HMS_IDENTITY_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

hms:
  security:
    # identity-service issues tokens rather than consuming them, so the shared
    # resource-server chain in hms-common stays switched off here.
    mode: issuer
  events:
    # kafka in deployed environments; log keeps the platform runnable with only Postgres.
    transport: ${HMS_EVENTS_TRANSPORT:log}
  audit:
    # "The 14th" means the hospital's 14th, not the container's. Same decision billing-service
    # makes for its day book, and the same trap: a UTC container serving a deployment in
    # Asia/Kolkata rolls the date over five and a half hours early, so a report for yesterday
    # would show part of the day before. A deployment that moves one of these must move both.
    zone: ${HMS_AUDIT_ZONE:Asia/Kolkata}
    # A hard cap on the CSV export. An unbounded audit table piped into a browser either times out
    # or exhausts the heap, and the file says so on its last line when the cap bites.
    export-max-rows: ${HMS_AUDIT_EXPORT_MAX_ROWS:50000}
  jwt:
    issuer: ${HMS_JWT_ISSUER:http://localhost:8081}
    audience: ${HMS_JWT_AUDIENCE:hms}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    # How long a session may sit idle before it has to be signed into again. Measured from the
    # current refresh token's created_at, which rotation makes the exact moment of last activity.
    idle-timeout: ${HMS_SESSION_IDLE_TIMEOUT:PT30M}
    # Shorter for a patient portal account: those sessions are opened on shared and family
    # machines far more often than a clinical workstation is.
    portal-idle-timeout: ${HMS_SESSION_PORTAL_IDLE_TIMEOUT:PT15M}
    # The bound that makes "session timeout" true rather than nominal. refresh-token-ttl slides
    # forward on every rotation, so a session refreshed daily would otherwise never end; this is
    # measured from the family's first token and nothing resets it.
    session-max-lifetime: ${HMS_SESSION_MAX_LIFETIME:P7D}
    # Supply PEMs from a secret manager in production; otherwise a keypair is
    # generated on first boot and stored in identity.signing_keys.
    private-key: ${HMS_JWT_PRIVATE_KEY:}
    public-key: ${HMS_JWT_PUBLIC_KEY:}
  seed:
    enabled: ${HMS_SEED_ENABLED:false}
    password: ${HMS_SEED_PASSWORD:ChangeMe!Dev2026}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
