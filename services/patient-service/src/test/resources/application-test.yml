# Integration tests run against a real PostgreSQL: the schema relies on pg_trgm,
# a sequence and Postgres types that an in-memory database would not reproduce.
spring:
  datasource:
    url: ${HMS_TEST_DB_URL:jdbc:postgresql://localhost:5432/hms_test}
    username: ${HMS_TEST_DB_USER:hms}
    password: ${HMS_TEST_DB_PASSWORD:hms}
    hikari:
      schema: patient
  flyway:
    enabled: true
hms:
  events:
    transport: log
  crypto:
    # A valid AES-256 key (32 bytes) that is unmistakably not a secret: it is 32 copies of
    # one byte, so its base64 has almost no entropy and no scanner mistakes it for a real
    # key. The previous value was a plausible-looking base64 blob, and gitleaks flagged it -
    # correctly, since a scanner cannot tell a fake key from a real one by reading a comment
    # next to it. Configured rather than left blank so tests exercise the supplied-key path
    # rather than the built-in fallback. Deployments supply HMS_PHI_KEY from a secret manager.
    phi-key: ERERERERERERERERERERERERERERERERERERERERERE=
logging:
  level:
    org.flywaydb: WARN
