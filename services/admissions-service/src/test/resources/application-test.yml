# Integration tests run against a real PostgreSQL: the whole point of the occupancy design is a
# partial unique index, and there is no in-memory substitute that enforces one.
spring:
  datasource:
    url: ${HMS_TEST_DB_URL:jdbc:postgresql://localhost:5432/hms_test}
    username: ${HMS_TEST_DB_USER:hms}
    password: ${HMS_TEST_DB_PASSWORD:hms}
    hikari:
      schema: admissions
  flyway:
    enabled: true
hms:
  events:
    transport: log
logging:
  level:
    org.flywaydb: WARN
